body: |-
  ## Decision
  
  Layer 060 owns provider-side hosted continuation of an authorization request that the provider already validated. The runtime accepts an immutable request snapshot and injected clock, browser binding, current client eligibility, session assurance, and storage contracts.
  
  Only successful atomic consumption returns the saved request. An expired record can suggest a client restart during a bounded browser-bound recovery window. An unavailable or untrusted flow stays on a provider-controlled surface.
  
  ## Boundaries
  
  The provider supplies browser and session evidence, checks the current exact registered redirect, and revalidates the authorization request before issuing a response. The relying-party callback transaction and browser session retain their independent lifecycles. The runtime supplies neither navigation nor token issuance.
  
  ## Consequences
  
  Every production storage adapter must implement atomic compare-and-consume across its workers. First enrollment, fresh assurance, product recovery destinations, and browser wiring require provider integration evidence.
