body: |-
  ## Decision
  
  Layer 120 owns the WIMSE interop catalogs, matrix generator, runner, and test-only adapters in `tba-test-interop-wimse`. Production packages must remain independent of this package. Protocol package ownership remains governed by ADR-1137, ADR-1138, and ADR-1140.
  
  Keep native WIMSE and SPIFFE conformance evidence distinct from named peer interop. SPIRE integration is an explicit composition. A scoped peer result establishes only the profile, roles, direction, configuration, and versions exercised. A qualified baseline permits execution. Each scenario requires its own result.
  
  ## Evidence and promotion
  
  Apply ADR-1011 and ADR-1023 to independent evidence and Tier 4 promotion. Repository-managed runs against independently authored peers can establish observed wire behavior. Tier 4 still requires qualifying evidence from an independent operator context and explicit approval under the existing compliance process.
  
  ## Scope
  
  The catalogs and generator exist. Candidate peer qualifications and the execution runner remain follow-up work. WIT with HTTP Message Signatures is a candidate profile. Before qualification, identify the component implementing the pinned binding in each role and the TbA boundary exercised. A TbA-owned binding requires its own protocol specification.
