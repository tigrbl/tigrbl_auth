body: |-
  ## Decision
  WIMSE identifier handling is shared by WIC and WIT. The native composition supports the wimse URI scheme with deployment-configured trust anchors and works without SPIFFE packages or SPIRE services.
  
  WIC composes the reusable X.509 certificate value. WIMSE mTLS composes the WIC profile with peer certificate and trust validation. WIT and WPT retain their separate concrete JWT-based objects and profile packages. WIT is the credential and WPT is the proof used to present it. Shared cryptographic and certificate services are composed through their existing contracts.
  
  ## Assurance
  Record the credential and authentication binding revisions independently. Evidence must identify the packages and roles exercised. This decision applies ADR-1137 and ADR-1138.
