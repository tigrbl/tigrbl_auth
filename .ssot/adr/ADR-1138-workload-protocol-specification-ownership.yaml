body: |-
  ## Decision
  Each protocol capability follows the requirements of the specification and revision it claims to implement. WIMSE capabilities follow the applicable WIMSE drafts. SPIFFE capabilities follow the applicable SPIFFE specifications. When a profile incorporates another specification, it applies its own requirements together with the requirements it incorporates.
  
  Shared primitives MAY serve both protocols. The package exposing a protocol capability owns its protocol-specific rules, including identifier interpretation, credential validation, trust selection, and proof binding. Downstream compositions MUST preserve those rules when combining capabilities.
