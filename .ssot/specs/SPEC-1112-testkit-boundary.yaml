body: |-
  ## Scope
  
  This specification governs `tba-testkit-identity`.
  
  ## First-Class Objects
  
  The package MUST define:
  
  - `FakeClock`
  - `FakeKeyStore`
  - `FakeRepository`
  - `FakePrincipalFactory`
  - `FakeCredentialFactory`
  - `FakeIdp`
  - `FakeOAuthClient`
  - `FakeResourceServer`
  - `ProtocolTestVector`
  - `ConformanceHarness`
  - `PeerProfileHarness`
  - `TestTenantFactory`
  - `TestAppFactory`
  - `TokenFixture`
  - `JoseFixture`
  
  ## Requirements
  
  Testkit owns fixtures, fake dependencies, conformance harnesses, protocol test
  vectors, and test client helpers.
  
  Production packages MUST NOT import testkit.
  
  ## Verification
  
  Verification MUST include a production import scan that fails if any
  production package imports `tba_identity.testkit`.
  
  ## Executable test packages
  Layer 120 owns repository-wide test suites grouped by protocol or capability and reusable test-only support. Package-local unit tests may live alongside their owning code. The root test runner collects migrated native suites during the transition. Independent peer fixtures are selected explicitly. SSOT test IDs and their proof links are preserved when a test moves, and executable paths and selectors must follow the relocated cases.
