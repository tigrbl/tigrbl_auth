body: |-
  ## Contract
  
  A continuation starts only after provider validation. The runtime persists a unique immutable record with issuer, tenant, active client, exact redirect, validated request parameters, opaque browser binding, required assurance, and timestamps.
  
  Resolve fails locally for an unknown, consumed, misbound, inactive, callback-mismatched, or insufficiently assured request. It yields the original request only after current binding, expiry, client and assurance checks and one successful atomic consume. An eligible expired flow may return the client identifier within its recovery window. It never supplies authorization parameters or a callback in the restart outcome.
  
  ## Verification
  
  Contract tests cover first enrollment, immutable request snapshot, replay, concurrent single consumption, expiration and bounded restart, isolation, live client and registered callback changes, and stale assurance. Production persistence and browser navigation are verified in the provider integration.
