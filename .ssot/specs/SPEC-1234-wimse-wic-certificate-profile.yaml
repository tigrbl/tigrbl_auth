body: |-
  ## Normative target
  https://datatracker.ietf.org/doc/html/draft-ietf-wimse-workload-creds-03#section-6.1
  
  ## Requirements
  The layer-10 WIC concrete MUST compose the reusable X.509 certificate object with a workload identifier. The WIC profile MUST obtain the workload identifier from the certificate's URI SAN and enforce exactly one URI SAN carrying a workload identifier. Apply the WIMSE identifier rules to that value. Other permitted SAN types retain their own certificate semantics. The profile result identifies the certificate and workload identifier for the selected verifier.
  
  ## Verification
  Use X.509 fixtures with a native wimse identifier, an allowed DNS SAN, a missing workload identifier, multiple workload identifiers, and invalid identifier syntax. Check consistency between the parsed certificate and WIC value. Peer authentication has separate evidence.
