body: |-
  ## Normative targets
  https://datatracker.ietf.org/doc/html/draft-ietf-wimse-workload-creds-03
  https://datatracker.ietf.org/doc/html/draft-ietf-wimse-wpt-02
  
  ## Requirements
  The WIT profile MUST validate the workload identifier, credential type, confirmation key, issuer signature, and validity using the trust anchors configured for the subject's trust domain. The WPT profile MUST enforce the specified HTTP presentation, proof signature and algorithm binding to the WIT confirmation key, audience, lifetime, and exact WIT hash. Define replay handling for the composed verifier. The WIT and WPT packages MUST remain independently composable with the required verification capabilities.
  
  ## Verification
  Test signed WITs and WPTs separately and together on the HTTP verifier path. Cover wrong domain anchors, mismatched confirmation keys, proof bound to a different WIT, wrong audience, expiry, and replay behavior. Record the exact revisions and prove native operation without SPIFFE or SPIRE.
