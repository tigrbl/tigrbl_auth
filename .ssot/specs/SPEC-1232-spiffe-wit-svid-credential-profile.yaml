body: |-
  ## Normative targets
  Pin the incubating SPIFFE WIT-SVID document at https://github.com/spiffe/spiffe/blob/5d15e3ee8782e205048d1f206fbf944e075f7bae/standards/WIT-SVID.md. Apply its incorporated WIMSE WIT requirements. Record the exact proof binding and revision used by each tested composition.
  
  ## Requirements
  The optional WIT-SVID profile MUST compose the shared SVID and WIT concretes. Enforce the SPIFFE subject, required key ID, confirmation JWK, allowed algorithms, and lifetime rules. Verify the issuer signature using the WIT-SVID signing key from the configured SPIFFE trust bundle. Acceptance for authentication requires proof of possession of the key in the verified credential, bound to the presentation under the selected proof protocol. Keep issuer and verifier roles explicit.
  
  ## Verification
  Track the profile as its own feature and proof chain. Exercise a signed credential and its bound proof, then reject wrong bundle keys, expired credentials, and proof bound to a different key or credential. Record replay handling for the selected proof protocol. Evidence must distinguish helper-level profile checks from composed authentication.
