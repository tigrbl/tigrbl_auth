body: |-
  ## Catalog
  
  The packaged TOML catalogs MUST define stable factor and level identities, scenario-scoped inputs, and named hops with caller and receiver roles. Credential, issuer, and fault choices MUST bind to the hop that uses or verifies them. Derive the authentication profile from transport and application proof. Scenario templates MUST identify the enforcing hop, policy, expected decision, and observed effect.
  
  ## Expansion
  
  Enumerate distinct structurally applicable scenarios from versioned catalogs. A requires predicate is a prerequisite. An excludes predicate removes an incompatible tuple. Preserve possible inputs that should be denied and encode the expected denial as an outcome. Trace exclusions apply to the expected event sequence. In particular, a provider denial before token release MUST have no release event.
  
  With the same catalog and generator versions, generation MUST produce deterministic unique IDs and identical membership. Validate factor references, fault applicability, and ordered events. Report structural and peer-assigned counts separately. The workbook is generated output. Establish coverage against the declared finite catalog and list any unsupported scenarios or missing adapters.
  
  ## Verification
  
  Verify WIC fault targeting, before-effect revocation order, bearer release order, all declared families and variants, and repeatability of the generated IDs. Keep legacy flat counts separate from scoped results.
