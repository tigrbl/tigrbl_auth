body: |-
  ## Capability record
  
  A capability MUST identify implementation, exact version or immutable artifact, role, profile, identifier scheme where applicable, relevant configuration, and qualification evidence. Keep caller, receiver, issuer, and supporting service roles separate. Candidate records MAY omit unresolved pins while pending. A placeholder or unpinned endpoint MUST remain unqualified.
  
  ## Pairing
  
  Resolve the endpoints and support roles per hop. Qualify each direction independently with a passing pinned baseline and retain the evidence reference. For chains, verify that adjacent hops agree on the connecting implementation and version. Combined WIC and application-layer profiles require evidence for their composition. Mark unsupported or blocked assignments explicitly and retain the coverage gap. An execution row is qualified only when its assigned roles and relevant baseline are qualified.
  
  ## HTTP Message Signatures
  
  For WIT with HTTP Message Signatures, pin the workload-to-workload binding revision and name the owner of signing and verification. The current candidate matrix cites draft-ietf-wimse-http-signature-08. Record the role and behavior exercised by TbA and by the external component. A generic HTTP signing implementation or an unrelated protocol profile cannot establish TbA ownership of this binding. If TbA implements the binding, link its separate protocol specification before qualification.
  
  ## Verification
  
  Validate role reversal and asymmetric capability, missing pins or evidence, identifier mismatch, composed profile qualification, and pending support roles. A qualified pairing grants no pass result to unexecuted scenarios.
