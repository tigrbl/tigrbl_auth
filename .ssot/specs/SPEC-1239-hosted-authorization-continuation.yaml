title: "Hosted Authorization Continuation"
status: "draft"
origin: "repo-local"
decision_date: null
tags: []
summary: "Create an expiring continuation after validating issuer, client registration, exact redirect, and the authorization request. Preserve state, nonce, and PKCE when present. Bind the continuation to the issuer, registered client, browser transaction, and required authentication context. If tenants share an issuer, use a host-resolved tenant and require the same tenant on inspection and resume. After the host reports the required verification or enrollment outcome, check the bindings and atomically consume an eligible continuation. Only a successful resume returns the validated request. Replay, timeout, mismatch, and storage failure cannot resume it. When a host enables a recovery window and retains the unconsumed record, an expired flow can return only its client identifier during that window, after matching issuer, client, browser, and tenant and revalidating current registration. The host chooses the restart destination. Governed feature: feat:hosted-authorization-continuation."
