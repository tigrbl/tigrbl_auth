body: |-
  ## Execution
  
  Execute qualified rows with versioned configurations. Batch rows only when they can reuse the same pinned setup without sharing mutable scenario state. Run a passing setup control before the batch and isolate effects, replay state, and revocation state across cases. A failed setup control blocks its dependent rows. No automatic retry may replace the recorded evidence for an earlier attempt.
  
  ## Results
  
  Record one reconciled result per execution ID with references to the attempts. Record input versions, peer configuration, role, direction, actual decision, reason, enforcing hop, event order, and observed effect. Distinguish pass, assertion failure, setup failure, blocked, and not run. An expected denial passes only if the decision and effect satisfy the oracle.
  
  Before-effect revocation requires an initial allow, observation of revocation by the enforcing service, and zero committed effects after that observation. Before bearer release, establish that no token was released. After release, observe the provider decision and effect under the provider policy.
  
  ## Evidence boundary
  
  Retain sanitized artifacts and reproducible execution instructions. Link the execution ID to the scenario, launch configuration, and evidence manifest. Apply ADR-1011 and ADR-1023 when using results for independent claims or promotion. A runner result does not authorize promotion.
