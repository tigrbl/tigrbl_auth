name: README standards

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  readme-standards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Enforce every active Python package with the shared plugin
        run: >-
          uv run --no-project --with readme-standards==0.1.1 pytest
          --readme-standards --readme-all --readme-root .
          -c tools/readme/pytest.ini --confcutdir tools/readme tools/readme
          --junitxml=artifacts/readme-plugin-results.xml
      - name: Check the complete package README standard
        run: uv run --no-project --with readme-standards==0.1.1 python scripts/verify_readme_standards.py --report artifacts/readme-standards.json
      - name: Check package metadata, legal files, and metric ownership
        run: uv run --no-project --with readme-standards==0.1.1 python scripts/verify_package_standards.py
      - name: Exercise README gate regressions
        run: >-
          uv run --no-project --with pytest --with readme-standards==0.1.1 python -I -m pytest
          pkgs/120-tests/tba-tests-release/tests/unit/test_readme_standards.py
          pkgs/120-tests/tba-tests-release/tests/unit/test_package_standards.py
          --confcutdir=pkgs/120-tests/tba-tests-release/tests/unit -c /dev/null -q
      - name: Reject undefined inputs in maintained Python examples
        run: >-
          uv run --no-project --with ruff==0.15.21 ruff check --isolated
          --select F821 --config 'include = ["**/docs/readme/*.py"]' .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: readme-standards-report
          path: artifacts/readme-standards.json
