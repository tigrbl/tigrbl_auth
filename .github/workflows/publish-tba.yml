name: Publish CWDO TbA release recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'tigrbl/tigrbl_auth' && github.ref == 'refs/heads/fxxx/cwdo-pypi-recovery'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 8336ed4eb6b76940653742fbf58ce0dba08049e7
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and verify the three merged packages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8336ed4eb6b76940653742fbf58ce0dba08049e7
          python -m pip install uv==0.11.28
          uv build --no-sources pkgs/50-protocols/tba-protocol-oidc-relying-party --out-dir "$PWD/dist/protocol"
          uv build --no-sources pkgs/30-storage-runtime/tba-runtime-relying-party-session --out-dir "$PWD/dist/runtime"
          uv build --no-sources pkgs/80-routers/tba-router-relying-party-session --out-dir "$PWD/dist/router"
          python - <<'PY'
          from pathlib import Path
          for directory, name, version in (
              ("protocol", "tba_protocol_oidc_relying_party", "0.4.0.dev4"),
              ("runtime", "tba_runtime_relying_party_session", "0.4.0.dev5"),
              ("router", "tba_router_relying_party_session", "0.4.0.dev5"),
          ):
              expected = {f"{name}-{version}-py3-none-any.whl", f"{name}-{version}.tar.gz"}
              actual = {path.name for path in Path("dist", directory).iterdir() if path.is_file()}
              if actual != expected:
                  raise SystemExit(f"Unexpected release files in {directory}: {actual}")
          PY
      - name: Upload the approved releases to PyPI
        shell: bash
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${UV_PUBLISH_TOKEN:-}"
          for package in protocol runtime router; do
            uv publish --check-url https://pypi.org/simple/ "dist/$package"/*
          done
