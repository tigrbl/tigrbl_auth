name: reusable quality

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.11'
      run-dependency-review:
        required: false
        type: boolean
        default: false
      run-codeql:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ inputs.run-dependency-review && github.event_name == 'pull_request' }}
    runs-on: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs/readme-standards-20261119' || (github.event_name == 'pull_request' && github.event.pull_request.number == 109 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["sad-lewin","shortlived","testing","trusted-public-ci","Linux","X64"]') || 'ubuntu-24.04' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  governance-and-devtest:
    runs-on: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs/readme-standards-20261119' || (github.event_name == 'pull_request' && github.event.pull_request.number == 109 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["sad-lewin","shortlived","testing","trusted-public-ci","Linux","X64"]') || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the shared README policy checker
        run: python -m pip install readme-standards==0.1.3
      - name: Verify shared README headers
        run: python scripts/render_readme_branding.py --check
      - name: Verify package metadata, legal files, and counters
        run: python scripts/verify_package_standards.py
      - name: Verify complete README sections, branding, and badges
        run: python scripts/verify_readme_standards.py
      - name: Select the requested runtime test interpreter
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install toolchain
        shell: bash
        run: python -m pip install --upgrade pip uv
      - name: Verify canonical registries
        shell: bash
        run: uv run python scripts/generate_claim_registries.py --verify
      - name: Verify current-state truth chain
        shell: bash
        # The recorded date is snapshot metadata. The verifier recomputes the current evidence and readiness.
        run: uv run python scripts/verify_truth_chain.py --mode current-state --use-recorded-date
      - name: Verify the package index
        shell: bash
        run: |
          uv run --locked --only-group dev index-toml --file index.toml validate
          uv run --locked --only-group dev python scripts/package_index.py --check
      - name: Verify package layer ownership
        shell: bash
        run: uv run python scripts/validate_layer_boundaries.py
      - name: Run independent identity runtime tests
        shell: bash
        run: |
          uv run --locked --group identity-lifecycle pytest -q \
            pkgs/120-tests/tba-tests-oidc/tests/unit/test_rp_session_vectors.py \
            pkgs/120-tests/tba-tests-oidc/tests/unit/test_oidc_logout_http_binding.py \
            pkgs/120-tests/tba-tests-browser-session/tests/integration/test_provider_logout_runtime.py \
            pkgs/120-tests/tba-tests-browser-session/tests/integration/test_hosted_authorization_continuation.py \
            pkgs/120-tests/tba-tests-authentication/tests/unit/test_mfa_enrollment_step_up_runtime.py \
            pkgs/120-tests/tba-tests-webauthn/tests/unit/test_webauthn_protocol_delivery.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Run relying-party TypeScript parity tests and build
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run test:rp
          npm run build:rp
      - name: Run devtest lane
        shell: bash
        run: uv run --locked --only-group dev --python 3.11 tox run -e py311-devtest

  codeql:
    if: ${{ inputs.run-codeql }}
    runs-on: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs/readme-standards-20261119' || (github.event_name == 'pull_request' && github.event.pull_request.number == 109 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["sad-lewin","shortlived","testing","trusted-public-ci","Linux","X64"]') || 'ubuntu-24.04' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:python
