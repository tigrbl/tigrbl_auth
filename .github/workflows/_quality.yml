name: reusable quality

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.11'
      run-dependency-review:
        required: false
        type: boolean
        default: false
      run-codeql:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ inputs.run-dependency-review && github.event_name == 'pull_request' }}
    runs-on: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs/readme-standards-20261119' || (github.event_name == 'pull_request' && github.event.pull_request.number == 109 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","trusted-public-ci"]') || 'ubuntu-24.04' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  governance-and-devtest:
    runs-on: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs/readme-standards-20261119' || (github.event_name == 'pull_request' && github.event.pull_request.number == 109 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","trusted-public-ci"]') || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the shared README policy checker
        run: python -m pip install readme-standards==0.1.1
      - name: Verify shared README headers
        run: python scripts/render_readme_branding.py --check
      - name: Verify package metadata, legal files, and counters
        run: python scripts/verify_package_standards.py
      - name: Verify complete README sections, branding, and badges
        run: python scripts/verify_readme_standards.py
      - name: Select the requested runtime test interpreter
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install toolchain
        shell: bash
        run: python -m pip install --upgrade pip tox uv
      - name: Verify canonical registries
        shell: bash
        run: uv run python scripts/generate_claim_registries.py --verify
      - name: Verify current-state truth chain
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            uv run python scripts/verify_truth_chain.py --mode current-state --use-recorded-date
          else
            uv run python scripts/verify_truth_chain.py --mode current-state
          fi
      - name: Verify package layer ownership
        shell: bash
        run: uv run python scripts/validate_layer_boundaries.py
      - name: Run devtest lane
        shell: bash
        run: tox -e py311-devtest

  codeql:
    if: ${{ inputs.run-codeql }}
    runs-on: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs/readme-standards-20261119' || (github.event_name == 'pull_request' && github.event.pull_request.number == 109 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","trusted-public-ci"]') || 'ubuntu-24.04' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:python
