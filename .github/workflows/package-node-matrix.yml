name: package-node-matrix

on:
  workflow_call:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      package:
        description: Node package to test, or all.
        required: false
        default: all
        type: string
      node-version:
        description: Optional single Node.js version to test.
        required: false
        default: all
        type: choice
        options:
          - all
          - "22"
          - "24"
          - "26"

permissions:
  contents: read

concurrency:
  group: package-node-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-node-matrix:
    runs-on: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs/readme-standards-20261119' || (github.event_name == 'pull_request' && github.event.pull_request.number == 109 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["sad-lewin","shortlived","testing","trusted-public-ci","Linux","X64"]') || 'ubuntu-24.04' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install Python for the shared metadata action
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Node for the discovery and metadata actions
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Discover UIX packages
        uses: cobycloud/actions/actions/monorepo-discover@aca75c25fa57e8c58ea9a333d0a4b5f25d9f8b0f
        with:
          package-globs: |
            pkgs/100-uix-core/*
            pkgs/105-ui/*
          ecosystem: node
      - name: Validate UIX package metadata
        uses: cobycloud/actions/actions/package-metadata@aca75c25fa57e8c58ea9a333d0a4b5f25d9f8b0f
        with:
          manifest-globs: |
            pkgs/100-uix-core/*/package.json
            pkgs/105-ui/*/package.json
          require-description: "true"
          require-license: "true"
          require-readme: "true"
          require-url: "true"
          report-json: reports/node-package-metadata.json
          report-md: reports/node-package-metadata.md
      - name: Build package x Node matrix
        id: matrix
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PACKAGE: ${{ inputs.package || 'all' }}
          CI_VERSION: ${{ inputs['node-version'] || 'all' }}
        run: >-
          uv run --no-project python scripts/package_ci.py node
          --base "$PR_BASE" --package "$CI_PACKAGE" --version "$CI_VERSION"

  isolated-node-package-tests:
    needs: discover-node-matrix
    if: ${{ needs.discover-node-matrix.outputs.count != '0' }}
    runs-on: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs/readme-standards-20261119' || (github.event_name == 'pull_request' && github.event.pull_request.number == 109 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["sad-lewin","shortlived","testing","trusted-public-ci","Linux","X64"]') || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJSON(needs.discover-node-matrix.outputs.matrix) }}
    name: ${{ matrix.package.name }} / Node ${{ matrix.package.node_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Run isolated UIX package checks
        uses: cobycloud/actions/actions/js-framework-ci@aca75c25fa57e8c58ea9a333d0a4b5f25d9f8b0f
        env:
          TBA_WORKSPACE: ${{ matrix.package.name }}
        with:
          framework: vite
          node-version: ${{ matrix.package.node_version }}
          working-directory: "."
          install-command: npm ci
          lint-command: ""
          typecheck-command: ""
          test-command: npm run test --if-present -w "$TBA_WORKSPACE"
          build-command: npm run build --if-present -w "$TBA_WORKSPACE"
          cache: npm
          cache-dependency-path: package-lock.json
