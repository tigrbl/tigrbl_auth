name: TbA X448 scoped release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tba-x448-scoped-publication
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 123997e921a10d3db56ce00464cacb8bc784a04b
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the four release candidates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv build --no-sources --out-dir "$RUNNER_TEMP/x448-dist" --project pkgs/010-concrete/tba-concrete-jose
          uv build --no-sources --out-dir "$RUNNER_TEMP/x448-dist" --project pkgs/010-concrete/tba-concrete-jwe
          uv build --no-sources --out-dir "$RUNNER_TEMP/x448-dist" --project pkgs/020-providers/tba-provider-jose-cryptography
          uv build --no-sources --out-dir "$RUNNER_TEMP/x448-dist" --project pkgs/120-tests/tba-tests-interop-jose
          cd "$RUNNER_TEMP/x448-dist"
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Verify candidates with published dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          uv venv "$RUNNER_TEMP/x448-venv"
          python="$RUNNER_TEMP/x448-venv/bin/python"
          uv pip install --python "$python" --only-binary :all: x448-dist/*.whl \
            'tba-capability-protected-envelope==0.4.0.dev2' \
            'tba-protocol-security-jwe==0.4.0.dev2' \
            'swarmauri-core==0.11.0.dev9' 'swarmauri-base==0.11.0.dev13' \
            'swarmauri-crypto-jwe==0.11.0.dev4' 'swarmauri-cipher-suite-jwa==0.11.0.dev4'
          uv pip check --python "$python"
          "$python" -I -m pytest --pyargs tba_tests_interop_jose.tests --jose-interop-mode=installed -vv
      - uses: actions/upload-artifact@v7
        with:
          name: x448-verified-distributions
          path: ${{ runner.temp }}/x448-dist/*
          if-no-files-found: error

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v8
        with:
          name: x448-verified-distributions
          path: x448-dist
      - name: Check artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          cd x448-dist
          sha256sum -c SHA256SUMS
          rm SHA256SUMS
      - name: Publish verified distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: x448-dist/
          attestations: false
          skip-existing: true
