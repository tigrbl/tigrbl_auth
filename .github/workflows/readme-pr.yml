name: README pull request gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  reviewed-branch:
    if: ${{ github.event.pull_request.number == 109 && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: tigrbl/tigrbl_auth/.github/workflows/readme-standards.yml@docs/readme-standards-20261119
  default-branch:
    if: ${{ github.event.pull_request.number != 109 || github.event.pull_request.head.repo.full_name != github.repository }}
    uses: tigrbl/tigrbl_auth/.github/workflows/readme-standards.yml@2ef1522768d561d5749335c24711ade95f6089f6
