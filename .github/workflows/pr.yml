name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tigrbl-operation-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: tigrbl/tigrbl
          ref: bb4736e2729ac81df513d747022f0badc3ea9109
          path: .interop/tigrbl
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Exercise mounted REST and JSON-RPC operations
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$(printf '%s:' "$PWD"/.interop/tigrbl/pkgs/*/*)"
          uv run --locked --extra test python -c 'from tigrbl import OperationSecurity'
          uv run --locked --extra test pytest --noconftest -q \
            pkgs/120-tests/tba-tests-runtime/tests/unit/test_tigrbl_operation_adapter.py

  quality:
    uses: ./.github/workflows/_quality.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    with:
      python-version: '3.11'
      run-dependency-review: true
      run-codeql: true

  contracts:
    uses: ./.github/workflows/_contract-build.yml
    permissions:
      contents: read
    with:
      python-version: '3.11'
      artifact-name: generated-contracts
