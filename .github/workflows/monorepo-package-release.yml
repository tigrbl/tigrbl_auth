name: monorepo-package-release-trusted-sequential

on:
  workflow_dispatch:
    inputs:
      standards_build:
        description: Build and validate the committed standards plan without publishing.
        type: boolean
        required: false
        default: false
      standards_artifact_run:
        description: Successful CI build run containing the selected immutable release artifacts.
        required: false
        default: ""
      standards_plan:
        description: Committed standards plan; package must select exactly one prepared release.
        required: false
        default: ""
      package:
        description: Package name to tag, or all.
        required: false
        default: all
      bump_type:
        description: Semver bump to apply before build, publish, and release.
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - finalize
      version:
        description: Optional exact version to set before release. Overrides bump_type.
        required: false
        default: ""
      force:
        description: Replace existing package tags.
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: monorepo-package-release-trusted-sequential
  cancel-in-progress: false

jobs:
  bump-package-versions:
    if: ${{ inputs.standards_plan == '' && !inputs.standards_build }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump selected package versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tomllib

          root = pathlib.Path(".").resolve()
          selected = "${{ inputs.package }}"
          exact_version = "${{ inputs.version }}"
          bump_type = "${{ inputs.bump_type }}"
          packages = []
          for pyproject in sorted((root / "pkgs").glob("*/*/pyproject.toml")):
              if selected == "all" and pyproject.relative_to(root / "pkgs").parts[0] == "deprecated":
                  continue
              data = tomllib.loads(pyproject.read_text(encoding="utf-8"))
              name = data["project"]["name"]
              if selected == "all" or selected == name:
                  packages.append((name, pyproject))
          if not packages:
              raise SystemExit(f"unknown package {selected!r}")
          for name, pyproject in packages:
              args = [sys.executable, "scripts/bump_pyproject_version.py"]
              if exact_version:
                  args.extend(["--set", exact_version])
              else:
                  args.extend(["--bump", bump_type])
              args.append(str(pyproject))
              print(f"::notice::Bumping {name} via {' '.join(args)}")
              subprocess.run(args, check=True)
          PY
      - name: Commit and push version bumps
        shell: bash
        run: |
          set -euo pipefail
          git add pkgs/*/*/pyproject.toml
          if git diff --cached --quiet; then
            echo "::notice::No version changes to commit."
          else
            git commit -m "Bump trusted release package versions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Build bumped package matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/monorepo_release.py release-matrix --package "${{ inputs.package }}"
      - name: Capture bumped revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  create-package-tags:
    needs: bump-package-versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-package-versions.outputs.sha }}
          fetch-depth: 0
      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create package release tags
        shell: bash
        run: |
          set -euo pipefail
          args=(--package "${{ inputs.package }}")
          if [[ "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi
          python scripts/monorepo_release.py create-tags "${args[@]}"

  resolve-dispatch-matrix:
    needs:
      - bump-package-versions
      - create-package-tags
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ needs.bump-package-versions.outputs.matrix }}
      count: ${{ needs.bump-package-versions.outputs.count }}
      sha: ${{ needs.bump-package-versions.outputs.sha }}
    steps:
      - name: Use bumped matrix
        run: echo "Using bumped package matrix."

  build-dispatch-package:
    if: ${{ needs.resolve-dispatch-matrix.outputs.count != '0' }}
    needs: resolve-dispatch-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.resolve-dispatch-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-dispatch-matrix.outputs.sha }}
      - name: Resolve package metadata at bumped revision
        id: package
        env:
          SELECTED_PACKAGE: ${{ inputs.package }}
          PACKAGE_INDEX: ${{ matrix.package.index }}
        run: python scripts/monorepo_release.py resolve-release-index --index "$PACKAGE_INDEX" --package "$SELECTED_PACKAGE"
      - name: Build package distribution
        uses: cobycloud/actions/actions/python-package-build@aca75c25fa57e8c58ea9a333d0a4b5f25d9f8b0f
        with:
          python-version: "3.12"
          project-path: ${{ steps.package.outputs.path }}
          out-dir: dist/${{ steps.package.outputs.name }}
          upload-artifact: "true"
          artifact-name: python-dist-${{ steps.package.outputs.name }}

  publish-dispatch-package:
    if: ${{ needs.resolve-dispatch-matrix.outputs.count != '0' }}
    needs:
      - resolve-dispatch-matrix
      - build-dispatch-package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.resolve-dispatch-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-dispatch-matrix.outputs.sha }}
      - name: Resolve package metadata at bumped revision
        id: package
        env:
          SELECTED_PACKAGE: ${{ inputs.package }}
          PACKAGE_INDEX: ${{ matrix.package.index }}
        run: python scripts/monorepo_release.py resolve-release-index --index "$PACKAGE_INDEX" --package "$SELECTED_PACKAGE"
      - uses: actions/download-artifact@v8
        with:
          name: python-dist-${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}
      - name: Publish package to PyPI with Trusted Publishing
        uses: cobycloud/actions/actions/pypi-trusted-publish@aca75c25fa57e8c58ea9a333d0a4b5f25d9f8b0f
        with:
          packages-dir: dist/${{ steps.package.outputs.name }}
          skip-existing: "true"

  github-release-dispatch:
    if: ${{ needs.resolve-dispatch-matrix.outputs.count != '0' }}
    needs:
      - resolve-dispatch-matrix
      - publish-dispatch-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.resolve-dispatch-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-dispatch-matrix.outputs.sha }}
      - name: Resolve package metadata at bumped revision
        id: package
        env:
          SELECTED_PACKAGE: ${{ inputs.package }}
          PACKAGE_INDEX: ${{ matrix.package.index }}
        run: python scripts/monorepo_release.py resolve-release-index --index "$PACKAGE_INDEX" --package "$SELECTED_PACKAGE"
      - uses: actions/download-artifact@v8
        with:
          name: python-dist-${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}
      - name: Create package GitHub release
        uses: cobycloud/actions/actions/github-release@aca75c25fa57e8c58ea9a333d0a4b5f25d9f8b0f
        with:
          tag-name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.tag }}
          body: |
            Package: `${{ steps.package.outputs.name }}`
            Version: `${{ steps.package.outputs.version }}`
            Distribution path: `${{ steps.package.outputs.path }}`
          files: |
            dist/${{ steps.package.outputs.name }}/*.whl
            dist/${{ steps.package.outputs.name }}/*.tar.gz
          draft: "true"
          prerelease: ${{ contains(steps.package.outputs.version, '.dev') && 'true' || 'false' }}
          make-latest: "false"
      - name: Publish release after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  build-standards-artifacts:
    if: ${{ inputs.standards_build && inputs.standards_plan != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Validate repaired source and release protocol
        run: |
          uv run --no-project python scripts/verify_readme_standards.py
          uv run --no-project python scripts/verify_package_standards.py
          uv run --no-project --with pytest python -I -m pytest tests/unit/test_readme_standards.py tests/unit/test_package_standards.py tests/unit/test_standards_release_artifacts.py tests/unit/test_sequential_standards_release.py --confcutdir=tests/unit -c /dev/null -q
      - name: Build and inspect all prepared artifacts without publishing
        env:
          STANDARDS_PLAN: ${{ inputs.standards_plan }}
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          uv run --no-project python scripts/build_standards_release.py --plan "$STANDARDS_PLAN" --out standards-dist --workers 8
          uv run --no-project --with twine twine check --strict standards-dist/*/*.whl standards-dist/*/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: package-standards-distributions
          path: standards-dist
          retention-days: 30

  publish-one-standards-package:
    if: ${{ inputs.standards_plan != '' && !inputs.standards_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi-${{ inputs.package }}
      url: https://pypi.org/project/${{ inputs.package }}/
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: package-standards-distributions
          run-id: ${{ inputs.standards_artifact_run }}
          github-token: ${{ github.token }}
          path: standards-dist
      - name: Inspect and stage exactly one previously validated release
        env:
          STANDARDS_PLAN: ${{ inputs.standards_plan }}
          SELECTED_PACKAGE: ${{ inputs.package }}
          SOURCE_ARTIFACT_RUN: ${{ inputs.standards_artifact_run }}
        run: |
          uv run --no-project python scripts/verify_readme_standards.py
          uv run --no-project python scripts/release_one_standards_package.py --plan "$STANDARDS_PLAN" --dist standards-dist --package "$SELECTED_PACKAGE" --phase prepare --source-artifact-run "$SOURCE_ARTIFACT_RUN"
      - name: Publish the selected package with Trusted Publishing
        uses: cobycloud/actions/actions/pypi-trusted-publish@aca75c25fa57e8c58ea9a333d0a4b5f25d9f8b0f
        with:
          packages-dir: prepared-dist
          skip-existing: "true"
      - name: Verify exact PyPI hashes and a clean PyPI-only installation
        env:
          STANDARDS_PLAN: ${{ inputs.standards_plan }}
          SELECTED_PACKAGE: ${{ inputs.package }}
          SOURCE_ARTIFACT_RUN: ${{ inputs.standards_artifact_run }}
        run: uv run --no-project python scripts/release_one_standards_package.py --plan "$STANDARDS_PLAN" --dist standards-dist --package "$SELECTED_PACKAGE" --phase verify --source-artifact-run "$SOURCE_ARTIFACT_RUN"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trusted-release-${{ inputs.package }}
          path: |
            trusted-release-receipt.json
            clean-install-check/*/install.log
          if-no-files-found: warn
