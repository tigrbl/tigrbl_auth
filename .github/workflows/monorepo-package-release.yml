name: Publish Portwyrm a31 Auth dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portwyrm-a31-auth-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/tags/portwyrm-a31-auth-publish-v1'
    runs-on:
      group: sad-lewin-tigrbl-auth-release
      labels: [sad-lewin, tigrbl-shortlived]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Build pinned compatibility distributions
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          uv run --no-project --python 3.12 python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          packages = [
              ("02-contracts/tigrbl-did-contracts", "0.4.0.dev2"),
              ("00-primitives/tigrbl-identity-core", "0.4.0.dev3"),
              ("02-contracts/tigrbl-digital-credential-contracts", "0.4.0.dev2"),
              ("02-contracts/tigrbl-identity-assurance-contracts", "0.4.0.dev2"),
              ("02-contracts/tigrbl-public-key-authentication-contracts", "0.4.0.dev2"),
              ("02-contracts/tigrbl-replay-contracts", "0.4.0.dev2"),
              ("02-contracts/tigrbl-security-event-contracts", "0.4.0.dev2"),
              ("02-contracts/tigrbl-security-trust-contracts", "0.1.0"),
              ("02-contracts/tigrbl-claim-contracts", "0.4.0.dev3"),
              ("02-contracts/tigrbl-token-contracts", "0.4.0.dev3"),
              ("02-contracts/tigrbl-workload-identity-contracts", "0.4.0.dev3"),
              ("02-contracts/tigrbl-attestation-contracts", "0.4.0.dev3"),
              ("02-contracts/tigrbl-identity-contracts", "0.4.0.dev3"),
              ("20-providers/tigrbl-secret-hashing-bcrypt-provider", "0.1.1"),
          ]
          out = Path("release-artifacts")
          out.mkdir()
          release_order = []
          for directory, version in packages:
              path = Path("pkgs") / directory
              project = tomllib.loads((path / "pyproject.toml").read_text())["project"]
              assert (project["name"], project["version"]) == (path.name, version)
              assert all(" @ " not in dep for dep in project.get("dependencies", ()))
              destination = out / path.name
              subprocess.run(
                  ["uv", "build", "--no-sources", str(path), "--out-dir", str(destination)],
                  check=True,
              )
              assert len(list(destination.glob("*.whl"))) == 1
              assert len(list(destination.glob("*.tar.gz"))) == 1
              release_order.append(f"{path.name} {version}\n")
          (out / "order.txt").write_text("".join(release_order))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-distributions
          path: release-artifacts/
          if-no-files-found: error

  publish:
    needs: build
    runs-on:
      group: sad-lewin-tigrbl-auth-release
      labels: [sad-lewin, tigrbl-shortlived]
    timeout-minutes: 20
    environment: pypi
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: auth-distributions
          path: ${{ runner.temp }}/auth-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Publish in dependency order and verify each upload
        shell: bash
        env:
          RELEASE_ARTIFACTS: ${{ runner.temp }}/auth-${{ github.run_id }}-${{ github.run_attempt }}
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${UV_PUBLISH_TOKEN:-}" ]]; then
            echo "::error::PYPI_API_TOKEN is unavailable in the pypi environment."
            exit 1
          fi
          uv run --no-project --python 3.12 python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          root = Path(os.environ["RELEASE_ARTIFACTS"])
          for line in (root / "order.txt").read_text().splitlines():
              name, version = line.split()
              files = sorted((root / name).iterdir())
              expected = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
              subprocess.run(
                  ["uv", "publish", "--check-url", "https://pypi.org/simple/", *map(str, files)],
                  check=True,
              )
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(
                          f"https://pypi.org/pypi/{name}/{version}/json", timeout=15
                      ) as response:
                          published = {
                              item["filename"]: item["digests"]["sha256"]
                              for item in json.load(response)["urls"]
                          }
                      if all(published.get(file) == digest for file, digest in expected.items()):
                          print(f"Verified {name}=={version}", flush=True)
                          break
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404:
                          raise
                  time.sleep(5)
              else:
                  raise SystemExit(f"PyPI did not return the expected files for {name}=={version}")
          PY
