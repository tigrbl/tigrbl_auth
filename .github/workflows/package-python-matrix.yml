name: package-python-matrix

on:
  pull_request:
    paths:
      - ".github/workflows/package-python-matrix.yml"
      - "pkgs/**"
      - "scripts/monorepo_release.py"
      - "tests/packages/**"
      - "tests/unit/test_monorepo_release.py"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/package-python-matrix.yml"
      - "pkgs/**"
      - "scripts/monorepo_release.py"
      - "tests/packages/**"
      - "tests/unit/test_monorepo_release.py"
  workflow_dispatch:
    inputs:
      package:
        description: Package name to test, or all.
        required: false
        default: all
      python-version:
        description: Optional single Python version to test.
        required: false
        default: all
        type: choice
        options:
          - all
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

permissions:
  contents: read

concurrency:
  group: package-python-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workload-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Run Layer 120 workload suites
        run: >-
          uv run --locked --extra test pytest
          pkgs/120-tests/tba-tests-wimse/tests
          pkgs/120-tests/tba-tests-spiffe/tests
          pkgs/120-tests/tba-tests-workload-composition/tests
          pkgs/120-tests/tba-tests-storage/tests
          pkgs/120-tests/tba-tests-authorization/tests
          pkgs/120-tests/tba-testkit-workload-credential-conformance/tests

  discover-package-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Discover split Python packages
        uses: cobycloud/actions/actions/monorepo-discover@aca75c25fa57e8c58ea9a333d0a4b5f25d9f8b0f
        with:
          package-globs: pkgs/*
          ecosystem: python
      - name: Validate split package metadata
        uses: cobycloud/actions/actions/package-metadata@aca75c25fa57e8c58ea9a333d0a4b5f25d9f8b0f
        with:
          manifest-globs: |
            pkgs/*/*/pyproject.toml
          require-description: "true"
          require-license: "true"
          require-readme: "true"
          require-url: "false"
          report-json: reports/package-metadata.json
          report-md: reports/package-metadata.md
      - name: Build package x Python matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          args=(--package "${{ inputs['package'] || 'all' }}")
          if [[ "${{ inputs['python-version'] || 'all' }}" != "all" ]]; then
            args+=(--python-version "${{ inputs['python-version'] }}")
          fi
          GITHUB_OUTPUT="$RUNNER_TEMP/package-cells.out" \
            python scripts/monorepo_release.py test-matrix "${args[@]}"
          python - "$RUNNER_TEMP/package-cells.out" "$RUNNER_TEMP/package-test-plan.json" <<'PY'
          import json
          import math
          import os
          import sys
          from collections import defaultdict
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8")
          cells = json.loads(next(line[7:] for line in raw.splitlines() if line.startswith("matrix=")))
          by_python = defaultdict(list)
          for cell in cells:
              by_python[cell["python_version"]].append(
                  {field: cell[field] for field in ("name", "path", "cell_id")}
              )
          batch_size = max(20, math.ceil(len(cells) / 250))
          plan = []
          matrix = []
          for version, group in sorted(by_python.items()):
              for offset in range(0, len(group), batch_size):
                  matrix.append({"batch": len(plan), "python": version})
                  plan.append(group[offset:offset + batch_size])
          assert len(matrix) <= 256
          Path(sys.argv[2]).write_text(json.dumps(plan), encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"matrix={json.dumps(matrix, separators=(',', ':'))}", file=output)
              print(f"count={len(matrix)}", file=output)
          PY
      - name: Upload package test plan
        if: ${{ steps.matrix.outputs.count != '0' }}
        uses: actions/upload-artifact@v7
        with:
          name: package-test-plan
          path: ${{ runner.temp }}/package-test-plan.json
          if-no-files-found: error

  isolated-package-tests:
    needs: discover-package-matrix
    if: ${{ needs.discover-package-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-package-matrix.outputs.matrix) }}
    name: Python ${{ matrix.python }} / Batch ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v6
      - id: setup-python
        uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: ${{ matrix.python }}
      - name: Retry Python setup
        if: steps.setup-python.outcome == 'failure'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package test toolchain
        shell: bash
        run: python -m pip install --upgrade pip uv tomli
      - uses: actions/download-artifact@v8
        with:
          name: package-test-plan
          path: ${{ runner.temp }}
      - name: Build and test each package in isolation
        shell: bash
        env:
          PACKAGE_BATCH: ${{ matrix.batch }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/package-test-plan.json"
          jq -er --argjson batch "$PACKAGE_BATCH" \
            '.[$batch][] | [.name, .path, .cell_id] | @tsv' "$plan" |
          (
            result=0
            while IFS=$'\t' read -r package path cell_id; do
              printf '%s\n' "::group::$package / Python $PYTHON_VERSION"
              if ! python -m uv build --project "$path" --out-dir "dist/$cell_id" ||
                 ! python scripts/monorepo_release.py isolated-test \
                   --package "$package" --python-version "$PYTHON_VERSION" --dist-dir "dist/$cell_id"; then
                result=1
              fi
              printf '%s\n' '::endgroup::'
            done
            exit "$result"
          )
