name: Certify and commit workspace artifacts

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Workspace version bump strategy
        required: true
        type: choice
        default: dev
        options: [dev, patch, minor, major]
      commit_message:
        description: Optional commit message
        type: string

concurrency:
  group: certify-artifacts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare the Python toolchain
        uses: cobycloud/actions/actions/python-uv@aca75c25fa57e8c58ea9a333d0a4b5f25d9f8b0f
        with:
          python-version: '3.11'
          install-command: uv lock --check
          run-command: ''
      - name: Select workspace version
        id: version
        shell: bash
        env:
          BUMP_KIND: ${{ inputs.bump }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          current = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:\.dev(\d+))?", current)
          if match is None:
              raise SystemExit(f"Unsupported workspace version: {current}")
          major, minor, patch = (int(part) for part in match.groups()[:3])
          match os.environ["BUMP_KIND"]:
              case "dev":
                  dev = int(match[4] or 0) + 1
              case "patch":
                  patch, dev = patch + 1, 1
              case "minor":
                  minor, patch, dev = minor + 1, 0, 1
              case "major":
                  major, minor, patch, dev = major + 1, 0, 0, 1
              case _:
                  raise SystemExit("Unsupported bump strategy")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"version={major}.{minor}.{patch}.dev{dev}", file=output)
          PY
      - name: Apply workspace version
        uses: cobycloud/actions/actions/version-bump@aca75c25fa57e8c58ea9a333d0a4b5f25d9f8b0f
        with:
          version: ${{ steps.version.outputs.version }}
          package-json-files: ''
          cargo-files: ''
      - name: Refresh workspace lock
        run: uv lock
      - name: Upload workspace metadata for certification
        uses: actions/upload-artifact@v7
        with:
          name: certify-workspace-version
          path: |
            pyproject.toml
            uv.lock
          if-no-files-found: error

  certify:
    needs: prepare
    uses: ./.github/workflows/_certification-matrix.yml
    with:
      workspace-version-artifact: certify-workspace-version

  commit:
    needs: [prepare, certify]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: certify-workspace-version
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: compliance-artifacts-py311-final-certification
          path: .artifacts/certify-final
      - name: Collect certification outputs
        shell: bash
        run: |
          set -euo pipefail
          source=.artifacts/certify-final
          target=artifacts/certify
          test -d "$source/docs/compliance"
          test -d "$source/dist/validated-runs"
          rm -rf -- "$target"
          for dir in docs/compliance dist/validated-runs dist/install-substrate \
              dist/runtime-smoke dist/migration-portability dist/test-reports; do
            if [[ -d "$source/$dir" ]]; then
              mkdir -p "$target/$(dirname "$dir")"
              cp -R -- "$source/$dir" "$target/$dir"
            fi
          done
          # The repository ignores generated dist directories, including nested copies.
          git add -f -- "$target"
      - name: Commit version and certification outputs
        if: inputs.commit_message == ''
        uses: cobycloud/actions/actions/git-commit-generated@aca75c25fa57e8c58ea9a333d0a4b5f25d9f8b0f
        with:
          paths: |
            pyproject.toml
            uv.lock
            artifacts/certify
          commit-message: 'chore(certify): bump workspace to ${{ needs.prepare.outputs.version }} and refresh certification artifacts'
      # The shared action interpolates its message into shell source. Treat the override as data.
      - name: Commit with the supplied message
        if: inputs.commit_message != ''
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail
          git add -- pyproject.toml uv.lock artifacts/certify
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "$COMMIT_MESSAGE"
          fi
      - name: Push certification commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
