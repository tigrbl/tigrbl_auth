version: 1
layer: 10-concrete
rules:
  ownership: one-primary-deterministic-concept-per-package
  contracts: materialize-layer-02-semantics
  bases: inherit-canonical-layer-05-family
  allowed_dependencies:
    - 00-primitives
    - 02-contracts
    - 05-bases
    - approved-10-refinements
  forbidden_dependencies:
    - 20-providers
    - 30-storage-runtime
    - 40-capabilities
    - 50-protocols
    - 60-runtime
    - 70-facade
    - 80-routers
  protocol_claim_sets: 50-protocols
  protocol_versions: 50-protocols
  durability: 01-storage-and-30-storage-runtime
  environment_io: 20-providers
families:
  claim:
    package_pattern: tba-claim-*-concrete
    base: tba-bases-claim
    cardinality: one-claim-class
  identity:
    packages:
      - tba-concrete-administrator-identity
      - tba-concrete-client-identity
      - tba-concrete-device-identity
      - tba-concrete-machine-identity
      - tba-concrete-service-identity
      - tba-concrete-user-identity
      - tba-concrete-workload-identity
    base: tba-bases-identity
    cardinality: one-identity-class
  authentication_credential:
    package_pattern: tba-*-credential-concrete
    base: tba-bases-authentication-credential
    cardinality: one-credential-class
  digital_credential:
    packages:
      - tba-concrete-cwt-svid-extension-credential
      - tba-concrete-jwt-svid-credential
      - tba-concrete-mdoc-credential
      - tba-concrete-vc-cose-credential
      - tba-concrete-vc-jose-credential
      - tba-concrete-wit-svid-credential
      - tba-concrete-x509-svid-credential
      - tba-concrete-sd-jwt-vc-credential
      - tba-concrete-verifiable-credential
    base: tba-bases-digital-credential
    cardinality: one-digital-credential-class
  presentation:
    packages:
      - tba-concrete-verifiable-presentation
    base: tba-bases-digital-credential
    cardinality: one-presentation-class
  attestation_evidence:
    packages:
      - tba-concrete-eat-evidence
    base: tba-bases-attestation
    cardinality: one-evidence-class
  deterministic_artifact_model:
    packages:
      - tba-concrete-eat
      - tba-concrete-mdoc
    cardinality: one-format-model-family
  capability_core:
    packages:
      - tba-concrete-capability
      - tba-concrete-capability-default
    base: tba-bases-capability
deprecated_compatibility_aggregates:
  tigrbl-identity-credentials-concrete:
    replacement: layer-70-facade
  tigrbl-identity-identities-concrete:
    replacement: layer-70-facade
  tigrbl-vcdm-concrete:
    canonical:
      - tba-concrete-verifiable-credential
      - tba-concrete-verifiable-presentation
      - tba-protocol-credential-w3c-vcdm
  tigrbl-sd-jwt-vc-concrete:
    canonical:
      - tba-concrete-sd-jwt-vc-credential
      - tba-profile-credential-sd-jwt-vc
serialization_aliases:
  cwt_registered_claims:
    owner: tba-protocol-cwt
    canonical_claims:
      1: tba-concrete-claim-issuer
      2: tba-concrete-claim-subject
      3: tba-concrete-claim-audience
      4: tba-concrete-claim-expiration
      5: tba-concrete-claim-not-before
      6: tba-concrete-claim-issued-at
      7: tba-concrete-claim-jwt-id
completed_protocol_extractions:
  cwt_registered_claim_serialization: tba-protocol-cwt
  eat: tba-protocol-attestation-eat
  iso_mdoc: tba-protocol-credential-iso-mdoc
  w3c_vcdm: tba-protocol-credential-w3c-vcdm
  sd_jwt_vc: tba-profile-credential-sd-jwt-vc
planned_protocol_extractions:
  corim: tba-protocol-attestation-corim
  did_core: tba-protocol-identity-did-core
  spiffe_svid: tba-protocol-workload-spiffe-svid
  set: tba-protocol-security-event-set
