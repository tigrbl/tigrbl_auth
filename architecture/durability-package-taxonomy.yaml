version: 1
layer: 30-storage-runtime
purpose: carrier-neutral durable operations and derived specifications for canonical layer-01 tables
rules:
  - canonical packages depend only on layers 00, 01, 02, 05, 10, 20, and Tigrbl's public table factories and bound handlers
  - canonical operations receive an engine or session through execution context
  - canonical packages do not own repositories, stores, services, HTTP carriers, protocols, or providers
  - one package groups tables that participate in the same durable lifecycle or atomic consistency boundary
substrate: tigrbl
canonical_packages:
  - tba-durability-attestation
  - tba-durability-audit
  - tba-durability-authority-graph
  - tba-durability-authorization-policy
  - tba-durability-consent
  - tba-durability-delegation
  - tba-durability-digital-credential
  - tba-durability-gnap-state
  - tba-durability-identity
  - tba-durability-key-material
  - tba-durability-oauth-state
  - tba-durability-oidc-state
  - tba-durability-presentation
  - tba-provider-policy-administration-memory
  - tba-durability-replay-protection
  - tba-durability-security-event
  - tba-durability-session
  - tba-durability-token
  - tba-durability-trust-federation-graph
  - tba-durability-webauthn
  - tba-durability-workload-identity
compatibility_packages:
  tba-runtime-identity-storage: aggregate facade and legacy lifecycle adapters
  tba-durability-authorization-policy-authority-derivation-graph: compatibility name and concrete graph re-exports
  tba-durability-identity-admin-trust-federation-graph: compatibility name and concrete graph re-exports
durability_owned_modules:
  engine: tba-runtime-identity-storage
