name: tba_auth_public_api_dev

services:
  public-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev-public-app
    image: tba-auth-public-app-dev:latest
    container_name: tba-auth-public-app-dev
    ports:
      - "8013:8000"
    environment:
      TBA_AUTH_PROFILE: ${TBA_AUTH_PROFILE:-production}
      AUTHN_ISSUER: ${AUTHN_ISSUER:-http://localhost:8013}
      TBA_AUTH_PROTECTED_RESOURCE_IDENTIFIER: ${TBA_AUTH_PROTECTED_RESOURCE_IDENTIFIER:-http://localhost:8013/resource}
      TBA_AUTH_REQUIRE_TLS: "false"
      TBA_AUTH_SESSION_COOKIE_FORCE_SECURE: "false"
      TBA_AUTH_ENABLE_RFC9207: "false"
      TBA_AUTH_BOOTSTRAP_ADMIN_USERNAME: ${TBA_AUTH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      TBA_AUTH_BOOTSTRAP_ADMIN_EMAIL: ${TBA_AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@example.test}
      TBA_AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${TBA_AUTH_BOOTSTRAP_ADMIN_PASSWORD:-AdminPass123!}
      TBA_AUTH_BOOTSTRAP_ADMIN_TENANT_SLUG: ${TBA_AUTH_BOOTSTRAP_ADMIN_TENANT_SLUG:-public}
      TBA_AUTH_BOOTSTRAP_ADMIN_FORCE_PASSWORD_CHANGE: "false"
      PG_HOST: ""
      PG_PORT: "5432"
      PG_DB: ""
      PG_USER: ""
      PG_PASS: ""
      REDIS_HOST: ""
      REDIS_PASSWORD: ""
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/.well-known/jwks.json', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
