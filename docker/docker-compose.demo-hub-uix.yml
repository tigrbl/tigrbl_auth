services:
  demo-hub-uix:
    build:
      context: ..
      dockerfile: pkgs/105-ui/tba-ui-demo-hub/Dockerfile
    container_name: tba-auth-demo-hub-uix-dev
    ports:
      - "3020:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TBA_AUTH_DEMO_ADMIN_PASSWORD: AdminPass123!
      TBA_AUTH_PUBLIC_BACKEND_APP_BASE_URL: http://host.docker.internal:8013
      TBA_AUTH_RESOURCE_VALIDATION_BACKEND_APP_BASE_URL: http://host.docker.internal:8014
      TBA_AUTH_PLATFORM_ADMIN_BACKEND_APP_BASE_URL: http://host.docker.internal:8015
      TBA_AUTH_TENANT_ADMIN_BACKEND_APP_BASE_URL: http://host.docker.internal:8016
      TBA_AUTH_DEVELOPER_BACKEND_APP_BASE_URL: http://host.docker.internal:8017
      TBA_AUTH_SERVICE_ADMIN_BACKEND_APP_BASE_URL: http://host.docker.internal:8018
      TBA_AUTH_PLATFORM_ADMIN_API_KEY: dev-platform-admin-key
      TBA_AUTH_TENANT_ADMIN_API_KEY: dev-tenant-admin-key
      TBA_AUTH_DEVELOPER_API_KEY: dev-developer-key
      TBA_AUTH_SERVICE_ADMIN_API_KEY: dev-service-admin-key
      VITE_TBA_AUTH_PUBLIC_UIX_URL: http://localhost:3010/#/login
      VITE_TBA_AUTH_PLATFORM_ADMIN_UIX_URL: http://localhost:3011/#/dashboard
      VITE_TBA_AUTH_TENANT_ADMIN_UIX_URL: http://localhost:3012/#/dashboard
      VITE_TBA_AUTH_DEVELOPER_UIX_URL: http://localhost:3013/#/dashboard
      VITE_TBA_AUTH_SERVICE_ADMIN_UIX_URL: http://localhost:3014/#/dashboard
      VITE_TBA_AUTH_MY_ACCOUNT_UIX_URL: http://localhost:3019/#/overview
      VITE_TBA_AUTH_PUBLIC_API_DOCS_URL: http://localhost:8013/docs
      VITE_TBA_AUTH_RESOURCE_VALIDATION_API_DOCS_URL: http://localhost:8014/docs
      VITE_TBA_AUTH_PLATFORM_ADMIN_API_DOCS_URL: http://localhost:8015/docs
      VITE_TBA_AUTH_TENANT_ADMIN_API_DOCS_URL: http://localhost:8016/docs
      VITE_TBA_AUTH_DEVELOPER_API_DOCS_URL: http://localhost:8017/docs
      VITE_TBA_AUTH_SERVICE_ADMIN_API_DOCS_URL: http://localhost:8018/docs
      VITE_TBA_AUTH_MY_ACCOUNT_API_DOCS_URL: http://localhost:8019/docs
