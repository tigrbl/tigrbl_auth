[project]
name = "tba-bases-security-trust-domain"
version = "0.1.1.dev1"
description = "Draft domain base classes composed from tigrbl security/trust contracts."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["tigrbl", "security", "trust", "domain-bases", "crypto", "signing", "tokens", "certificates", "cipher-suites"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Typing :: Typed", "Topic :: Security", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Intended Audience :: Developers"]
dependencies = ["tba-bases-certificate==0.4.0.dev3", "tba-bases-capability==0.4.0.dev3", "tba-bases-did==0.4.0.dev3", "tba-bases-encryption==0.4.0.dev3", "tba-bases-claim==0.4.0.dev3", "tba-contracts-identity==0.4.0.dev3", "tba-bases-identity==0.4.0.dev3", "tba-bases-authentication-context==0.4.0.dev3", "tba-bases-protected-artifact==0.4.0.dev3", "tba-contracts-security-trust==0.1.1.dev1", "tba-bases-key==0.4.0.dev3", "tba-bases-proof-of-possession==0.4.0.dev3", "tba-bases-signing==0.4.0.dev3", "tba-bases-token-introspection==0.4.0.dev3", "tba-bases-trust==0.4.0.dev3", "tba-bases-workload-identity==0.4.0.dev3"]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/005-bases/tba-bases-security-trust-domain#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/005-bases/tba-bases-security-trust-domain#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/005-bases/tba-bases-security-trust-domain"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-bases-security-trust-domain/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_bases_security_trust_domain", from = "src" }]

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "tigrbl-auth"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl_auth"
ref = "master"
package_path = "pkgs/005-bases/tba-bases-security-trust-domain"
layer = "005-bases"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tba-bases-security-trust-domain"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/005-bases/tba-bases-security-trust-domain/docs/readme/test_examples.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/005-bases/tba-bases-security-trust-domain/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[dependency-groups]
dev = ["readme-standards==0.1.1; python_version >= \"3.11\""]
