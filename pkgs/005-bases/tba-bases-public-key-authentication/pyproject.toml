[project]
name = "tba-bases-public-key-authentication"
version = "0.4.0.dev3"
description = "Protocol-neutral public-key authenticator extension bases."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
license = "Apache-2.0"
dependencies = ["tba-contracts-public-key-authentication==0.4.0.dev3"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/005-bases/tba-bases-public-key-authentication#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/005-bases/tba-bases-public-key-authentication#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/005-bases/tba-bases-public-key-authentication"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-bases-public-key-authentication/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_bases_public_key_authentication", from = "src" }]

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "tigrbl-auth"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl_auth"
ref = "master"
package_path = "pkgs/005-bases/tba-bases-public-key-authentication"
layer = "005-bases"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tba-bases-public-key-authentication"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/005-bases/tba-bases-public-key-authentication/docs/readme/test_examples.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/005-bases/tba-bases-public-key-authentication/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[dependency-groups]
dev = ["readme-standards==0.1.3; python_version >= \"3.11\""]
