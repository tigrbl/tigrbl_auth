[project]
name = "tba-primitives-dns-name"
version = "0.4.0.dev3"
description = "DNS names, IDNA, and DNS name wire primitives."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = ["idna>=3,<4"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_primitives_dns_name", from = "src" }]
