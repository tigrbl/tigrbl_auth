[project]
name = "tba-app-backend-public"
version = "0.4.0.dev3"
description = "Public OAuth/OIDC and human-login backend application for TBA."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
license = "Apache-2.0"
dependencies = ["tba-auth==0.4.0.dev3", "tba-app-backend-core==0.4.0.dev3", "tba-router-oauth-authorization==0.4.0.dev3", "tba-router-oauth-authorization-server-metadata==0.4.0.dev3", "tba-router-oauth-device-authorization==0.4.0.dev3", "tba-router-oauth-introspection==0.4.0.dev3", "tba-router-oauth-pushed-authorization-request==0.4.0.dev3", "tba-router-oauth-protected-resource-metadata==0.4.0.dev3", "tba-router-oauth-registration==0.4.0.dev3", "tba-router-oauth-revocation==0.4.0.dev3", "tba-router-oauth-token==0.4.0.dev3", "tba-router-oauth-token-exchange==0.4.0.dev3", "tba-router-oidc-discovery==0.4.0.dev3", "tba-router-oidc-logout==0.4.0.dev3", "tba-router-oidc-userinfo==0.4.0.dev3", "tba-router-session-login==0.4.0.dev3", "tba-router-webauthn==0.4.0.dev3"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/090-backend-apps/tba-app-backend-public#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/090-backend-apps/tba-app-backend-public"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/090-backend-apps/tba-app-backend-public#readme"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-app-backend-public/"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_app_backend_public", from = "src" }]
