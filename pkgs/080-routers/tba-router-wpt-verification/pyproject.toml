[project]
name = "tba-router-wpt-verification"
version = "0.4.0.dev3"
description = "Authenticated remote WIT/WPT verification for a configured recipient."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = ["tigrbl==0.4.5.dev8", "pydantic>=2,<3", "tba-concrete-jwt==0.4.0.dev3", "tba-profile-workload-proof-wimse-wpt==0.4.0.dev5"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/080-routers/tba-router-wpt-verification#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/080-routers/tba-router-wpt-verification#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/080-routers/tba-router-wpt-verification"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-router-wpt-verification/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_router_wpt_verification", from = "src" }]
