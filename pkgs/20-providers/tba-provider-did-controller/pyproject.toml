[project]
name = "tba-provider-did-controller"
version = "0.4.0.dev2"
description = "Authorization-checked DID document controller provider."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-concrete-did==0.4.0.dev2", "tba-contracts-identity==0.4.0.dev2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_did_controller", from = "src" }]
