[project]
name = "tba-provider-certificate-path-validator"
version = "0.4.0.dev2"
description = "Explicitly profiled certificate path validation provider."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-bases-certificate==0.4.0.dev2", "tba-contracts-security-trust==0.1.0"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_certificate_path_validator", from = "src" }]
