[project]
name = "tba-provider-attestation-appraiser"
version = "0.4.0.dev2"
description = "Reference-backed attestation appraisal provider."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-bases-attestation==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_attestation_appraiser", from = "src" }]
