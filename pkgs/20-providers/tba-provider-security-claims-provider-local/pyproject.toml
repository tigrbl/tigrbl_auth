[project]
name = "tba-provider-security-claims-provider-local"
version = "0.1.0"
description = "Local claims provider wrapper for the TBA package suite."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-contracts-identity==0.4.0.dev2",
    "tba-bases-claim==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_security_claims_provider_local", from = "src" }]
