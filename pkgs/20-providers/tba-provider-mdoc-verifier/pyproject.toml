[project]
name = "tba-provider-mdoc-verifier"
version = "0.4.0.dev2"
description = "ISO mdoc credential verifier provider."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-bases-digital-credential==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-concrete-mdoc==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_mdoc_verifier", from = "src" }]
