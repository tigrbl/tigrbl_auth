[project]
name = "tba-provider-eat-verifier"
version = "0.4.0.dev2"
description = "Profile-aware EAT evidence verifier provider."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-bases-attestation==0.4.0.dev2",
    "tba-concrete-eat==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_eat_verifier", from = "src" }]
