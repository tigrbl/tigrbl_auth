[project]
name = "tba-provider-secret-hashing-bcrypt"
version = "0.1.0"
description = "Bcrypt shared-secret hashing and verification provider for TBA."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "bcrypt==5.0.0",
    "tba-contracts-identity==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_secret_hashing_bcrypt", from = "src" }]
