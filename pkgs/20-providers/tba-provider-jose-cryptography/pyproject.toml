[project]
name="tba-provider-jose-cryptography"
version="0.4.0.dev4"
description = "Neutral cryptography-backed JWS and JWE provider."
license = "Apache-2.0"
readme = "README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
dependencies = ["cryptography>=45.0.0", "tba-bases-protected-envelope==0.4.0.dev3", "tba-contracts-protected-envelope==0.4.0.dev3", "tba-concrete-jws==0.4.0.dev3", "tba-concrete-jwe==0.4.0.dev3", "tba-primitives-identity==0.4.0.dev3"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/20-providers/tba-provider-jose-cryptography#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/20-providers/tba-provider-jose-cryptography#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/20-providers/tba-provider-jose-cryptography"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-provider-jose-cryptography/"
[build-system]
requires=["poetry-core>=2.2.0,<3.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_provider_jose_cryptography",from="src"}]