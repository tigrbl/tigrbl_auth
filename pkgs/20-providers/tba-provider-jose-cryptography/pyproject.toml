[project]
name="tba-provider-jose-cryptography"
version="0.4.0.dev2"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "cryptography>=45.0.0",
    "tba-bases-protected-envelope==0.4.0.dev2",
    "tba-contracts-protected-envelope==0.4.0.dev2",
    "tba-concrete-jws==0.4.0.dev2",
    "tba-concrete-jwe==0.4.0.dev2",
    "tba-primitives-identity==0.4.0.dev2",
]
[build-system]
requires=["poetry-core>=1.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_provider_jose_cryptography",from="src"}]