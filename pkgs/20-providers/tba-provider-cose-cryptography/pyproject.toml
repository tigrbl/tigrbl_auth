[project]
name = "tba-provider-cose-cryptography"
version = "0.4.0.dev2"
description = "Cryptography-backed COSE key and signature provider."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "cryptography>=45.0.0",
    "tba-bases-cose==0.4.0.dev2",
    "tba-concrete-cose==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_cose_cryptography", from = "src" }]
