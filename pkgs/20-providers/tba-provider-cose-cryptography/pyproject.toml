[project]
name = "tba-provider-cose-cryptography"
version = "0.4.0.dev2"
readme = "README.md"
description = "Cryptography-backed COSE key and signature provider."
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = "Apache-2.0"
dependencies = [
    "cryptography>=45.0.0",
    "tba-bases-cose==0.4.0.dev2",
    "tba-concrete-cose==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_cose_cryptography", from = "src" }]
