[project]
name = "tba-provider-spiffe-bundle"
version = "0.4.0.dev2"
description = "Versioned SPIFFE trust-bundle provider."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-bases-workload-identity==0.4.0.dev2", "tba-contracts-workload-identity==0.4.0.dev2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_spiffe_bundle", from = "src" }]
