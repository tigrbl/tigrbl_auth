[project]
name = "tba-provider-replay-memory"
version = "0.4.0.dev2"
description = "Non-durable single-process replay reservation provider."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-contracts-identity==0.4.0.dev2",
    "tba-bases-replay==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
    "tba-provider-security-proof-pkce==0.1.0",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_replay_memory", from = "src" }]
