[project]
name = "tba-provider-jose-swarmauri"
version = "0.4.0.dev2"
description = "Deprecated compatibility facade for TBA's internal JOSE provider."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-provider-identity-jose==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_jose_swarmauri", from = "src" }]
