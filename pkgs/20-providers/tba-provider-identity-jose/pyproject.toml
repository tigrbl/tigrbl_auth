[project]
name = "tba-provider-identity-jose"
version = "0.4.0.dev4"
description = "JOSE, JWT, JWS, JWE, JWK, JWKS, key rotation, and standards helpers for TBA identity tokens."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "identity",
    "jose",
    "jwt",
    "jwk",
    "jwks",
    "jws",
    "jwe",
    "key-rotation",
    "oauth",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["tba-concrete-jose==0.4.0.dev4", "cryptography>=45.0.0", "tba-bases-jose==0.4.0.dev4", "tba-contracts-security-key-rotation-policy==0.1.1.dev2", "tba-provider-secret-hashing-bcrypt==0.1.1.dev2", "tba-contracts-identity==0.4.0.dev4", "tba-primitives-identity==0.4.0.dev4", "tba-provider-security-signing-pqc==0.1.1.dev2"]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/20-providers/tba-provider-identity-jose#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/20-providers/tba-provider-identity-jose"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-provider-identity-jose/"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/20-providers/tba-provider-identity-jose#readme"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_identity_jose", from = "src" }]
