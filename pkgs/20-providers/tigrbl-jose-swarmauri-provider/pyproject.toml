[project]
name = "tigrbl-jose-swarmauri-provider"
version = "0.4.0.dev2"
description = "Deprecated compatibility facade for Tigrbl Auth's internal JOSE provider."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tigrbl-identity-jose==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tigrbl_jose_swarmauri_provider", from = "src" }]
