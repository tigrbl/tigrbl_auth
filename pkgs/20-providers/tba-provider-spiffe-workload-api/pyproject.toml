[project]
name = "tba-provider-spiffe-workload-api"
version = "0.4.0.dev2"
readme = "README.md"
description = "SPIFFE Workload API provider."
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = "Apache-2.0"
dependencies = ["tba-concrete-svid==0.4.0.dev2", "tba-bases-workload-identity==0.4.0.dev2", "tba-contracts-workload-identity==0.4.0.dev2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_spiffe_workload_api", from = "src" }]
