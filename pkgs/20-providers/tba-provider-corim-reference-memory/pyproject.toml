[project]
name = "tba-provider-corim-reference-memory"
version = "0.4.0.dev4"
description = "Non-durable in-memory CoRIM reference-material provider."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
license = "Apache-2.0"
dependencies = ["tba-concrete-corim==0.4.0.dev4", "tba-contracts-identity==0.4.0.dev4"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/20-providers/tba-provider-corim-reference-memory#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/20-providers/tba-provider-corim-reference-memory#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/20-providers/tba-provider-corim-reference-memory"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-provider-corim-reference-memory/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_corim_reference_memory", from = "src" }]
