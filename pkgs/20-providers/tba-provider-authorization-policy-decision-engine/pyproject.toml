[project]
name = "tba-provider-authorization-policy-decision-engine"
version = "0.4.0.dev2"
description = "Concrete authorization policy decision engine provider."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-contracts-authorization==0.4.0.dev3",
    "tba-concrete-policy-decision-engine-default==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-primitives-identity==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_authorization_policy_decision_engine", from = "src" }]
