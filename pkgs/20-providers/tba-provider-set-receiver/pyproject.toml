[project]
name = "tba-provider-set-receiver"
version = "0.4.0.dev2"
description = "RFC 8417 Security Event Token receiver provider."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-contracts-identity==0.4.0.dev2",
    "tba-bases-security-event==0.4.0.dev2",
    "tba-concrete-set==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_set_receiver", from = "src" }]
