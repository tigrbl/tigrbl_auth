[project]
name = "tba-provider-security-cose"
version = "0.4.0.dev2"
description = "Compatibility facade for the split COSE concrete and cryptography packages."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-concrete-cose==0.4.0.dev2",
    "tba-provider-cose-cryptography==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_security_cose", from = "src" }]
