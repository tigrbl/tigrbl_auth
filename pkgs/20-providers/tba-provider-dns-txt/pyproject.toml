[project]
name = "tba-provider-dns-txt"
version = "0.4.0.dev2"
description = "Typed DNS TXT lookup provider."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = [
    "tba-contracts-dns==0.4.0.dev2",
    "tba-primitives-dns-name==0.4.0.dev2",
    "tba-codec-dns==0.4.0.dev2",
    "tba-provider-dns-resolver==0.4.0.dev2",
]

[project.optional-dependencies]
http2 = ["tba-provider-dns-resolver[http2]==0.4.0.dev2"]
quic = ["tba-provider-dns-resolver[quic]==0.4.0.dev2"]
trio = ["tba-provider-dns-resolver[trio]==0.4.0.dev2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_dns_txt", from = "src" }]
