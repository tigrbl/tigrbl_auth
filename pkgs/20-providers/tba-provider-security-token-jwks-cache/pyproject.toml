[project]
name = "tba-provider-security-token-jwks-cache"
version = "0.1.0"
description = "JWKS-backed verification key cache provider for Tigrbl security token validation."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-contracts-identity==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
    "tba-bases-token-introspection==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_security_token_jwks_cache", from = "src" }]
