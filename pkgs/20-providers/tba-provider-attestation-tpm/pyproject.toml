[project]
name = "tba-provider-attestation-tpm"
version = "0.4.0.dev2"
description = "WebAuthn TPM attestation verifier."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["cbor2==6.1.3", "cryptography>=45", "tba-concrete-cose==0.4.0.dev2", "tba-provider-cose-cryptography==0.4.0.dev2", "tba-contracts-identity==0.4.0.dev2", "tba-bases-public-key-authentication==0.4.0.dev2"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_provider_attestation_tpm", from = "src" }]
