[project]
name = "tba-provider-authorization-resource-server-verifier"
version = "0.4.0.dev4"
description = "Protected-resource verifier provider for TBAorization resource servers."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
license = "Apache-2.0"
dependencies = ["tba-contracts-identity==0.4.0.dev4", "tba-bases-resource-server==0.4.0.dev4", "tba-provider-security-dpop-cnf-binding-validator==0.1.1.dev2", "tba-provider-security-mtls-cnf-binding-validator==0.1.1.dev2", "tba-provider-token-introspection==0.1.1.dev2", "tba-provider-security-token-jwks-cache==0.1.1.dev2", "tba-contracts-security-trust==0.1.1.dev2"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/20-providers/tba-provider-authorization-resource-server-verifier#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/20-providers/tba-provider-authorization-resource-server-verifier#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/20-providers/tba-provider-authorization-resource-server-verifier"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-provider-authorization-resource-server-verifier/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_authorization_resource_server_verifier", from = "src" }]
