[project]
name = "tba-provider-authorization-resource-server-verifier"
version = "0.4.0.dev2"
description = "Protected-resource verifier provider for TBAorization resource servers."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-contracts-identity==0.4.0.dev2",
    "tba-bases-resource-server==0.4.0.dev2",
    "tba-provider-security-dpop-cnf-binding-validator==0.1.0",
    "tba-provider-security-mtls-cnf-binding-validator==0.1.0",
    "tba-provider-token-introspection==0.1.0",
    "tba-provider-security-token-jwks-cache==0.1.0",
    "tba-contracts-security-trust==0.1.0",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_authorization_resource_server_verifier", from = "src" }]
