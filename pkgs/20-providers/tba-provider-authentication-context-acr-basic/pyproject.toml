[project]
name = "tba-provider-authentication-context-acr-basic"
version = "0.1.0"
description = "Basic ACR evaluator provider for the TBA package suite."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-concrete-acr-evaluator-basic==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_authentication_context_acr_basic", from = "src" }]
