[project]
name = "tba-provider-fido-metadata-service"
version = "0.4.0.dev2"
description = "FIDO Metadata Service signed-blob and authenticator status provider."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-contracts-identity==0.4.0.dev2", "tba-bases-public-key-authentication==0.4.0.dev2"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_provider_fido_metadata_service", from = "src" }]
