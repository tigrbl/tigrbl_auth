[project]
name = "tba-contracts-digital-credential"
version = "0.4.0.dev2"
description = "Representation-neutral digital credential contracts."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_contracts_digital_credential", from = "src" }]
