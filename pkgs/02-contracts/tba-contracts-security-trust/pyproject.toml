[project]
name = "tba-contracts-security-trust"
version = "0.1.1.dev2"
description = "Draft horizontal contracts and DTOs for security, trust, key, crypto, and cipher-suite components."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["tigrbl", "security", "trust", "contracts", "crypto", "signing", "tokens", "certificates", "cipher-suites"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
]
dependencies = ["tba-primitives-identity==0.4.0.dev4"]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/02-contracts/tba-contracts-security-trust#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/02-contracts/tba-contracts-security-trust#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/02-contracts/tba-contracts-security-trust"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-contracts-security-trust/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_contracts_security_trust", from = "src" }]
