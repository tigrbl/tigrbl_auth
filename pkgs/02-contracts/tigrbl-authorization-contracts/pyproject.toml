[project]
name = "tigrbl-authorization-contracts"
version = "0.4.0.dev3"
description = "Canonical platform authorization request, role, grant, and decision contracts."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tigrbl_authorization_contracts", from = "src" }]
