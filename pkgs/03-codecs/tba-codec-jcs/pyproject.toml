[project]
name = "tba-codec-jcs"
version = "0.4.0.dev4"
description = "RFC 8785 JSON Canonicalization Scheme codec."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
license = "Apache-2.0"
dependencies = ["rfc8785>=0.1.4,<0.2"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/03-codecs/tba-codec-jcs#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/03-codecs/tba-codec-jcs#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/03-codecs/tba-codec-jcs"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-codec-jcs/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_codec_jcs", from = "src" }]
