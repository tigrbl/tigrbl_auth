[project]
name = "tba-server-identity"
version = "0.4.0.dev3"
description = "Carrier-neutral identity runtime handlers, capability assembly, and lifecycle integration."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "identity",
    "server",
    "asgi",
    "gateway",
    "plugin",
    "rest",
    "oauth",
    "oidc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["tba-runtime-oidc-provider-logout==0.4.0.dev0", "tba-capability-api-key-authentication==0.4.0.dev3", "tba-capability-service-key-authentication==0.4.0.dev3", "tba-capability-account-self-service==0.4.0.dev3", "tba-certification-release==0.4.0.dev3", "tba-protocol-oauth==0.4.0.dev3", "tba-protocol-oidc==0.4.0.dev3", "tba-protocol-gnap==0.4.0.dev3", "tba-contracts-identity==0.4.0.dev3", "tba-capability-identity-administration==0.4.0.dev3", "tba-capability-realm-administration==0.4.0.dev3", "tba-capability-tenant-administration==0.4.0.dev3", "tba-provider-identity-jose==0.4.0.dev3", "tba-runtime-identity==0.4.0.dev4", "tigrbl==0.4.5.dev8", "tigrbl-core==0.4.5.dev6", "tba-runtime-identity-storage==0.4.0.dev3", "tba-storage-audit==0.4.0.dev3", "tba-storage-oauth==0.4.0.dev3", "tba-storage-operator==0.4.0.dev3", "tba-storage-principals==0.4.0.dev3", "tba-storage-tenancy==0.4.0.dev3", "tba-capability-client-secret-authentication==0.4.0.dev3", "tba-capability-password-authentication==0.4.0.dev3", "tba-capability-artifact-processing==0.4.0.dev3", "tba-capability-replay-protection==0.4.0.dev3", "tba-capability-token-introspection==0.4.0.dev3", "tba-capability-token-issuance==0.4.0.dev3", "tba-capability-token-exchange==0.4.0.dev3", "tba-capability-token-revocation==0.4.0.dev3", "tba-capability-authorization-request-staging==0.4.0.dev3", "tba-capability-client-registration==0.4.0.dev3", "tba-provider-replay-memory==0.4.0.dev4", "tba-provider-secret-hashing-bcrypt==0.1.1.dev1"]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/060-runtime/tba-server-identity#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/060-runtime/tba-server-identity"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-server-identity/"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/060-runtime/tba-server-identity#readme"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_server_identity", from = "src" }]

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "tigrbl-auth"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl_auth"
ref = "master"
package_path = "pkgs/060-runtime/tba-server-identity"
layer = "060-runtime"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tba-server-identity"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/060-runtime/tba-server-identity/docs/readme/test_examples.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/060-runtime/tba-server-identity/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[dependency-groups]
dev = ["readme-standards==0.1.3; python_version >= \"3.11\""]
