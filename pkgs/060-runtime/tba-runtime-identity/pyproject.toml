[project]
name = "tba-runtime-identity"
version = "0.4.0.dev4"
description = "Runtime assembly, profile loading, feature flags, deployment resolution, runner adapters, and diagnostics for TBA identity apps."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "identity",
    "runtime",
    "asgi",
    "uvicorn",
    "hypercorn",
    "tigrcorn",
    "feature-flags",
    "deployment-profile",
    "iam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["cryptography>=45", "tba-bases-certificate==0.4.0.dev3", "tba-concrete-certificate-x509==0.4.0.dev3", "tba-contracts-security-trust==0.1.1.dev1", "tba-profile-workload-credential-wimse-wic==0.4.0.dev3", "tba-profile-workload-credential-wimse-wit==0.4.0.dev5", "tba-profile-workload-proof-wimse-wpt==0.4.0.dev5", "tba-protocol-workload-wimse-identifier==0.4.0.dev3", "tba-provider-jose-cryptography==0.4.0.dev5", "tba-profile-workload-authentication-wimse-mtls==0.4.0.dev3", "tba-provider-secret-hashing-bcrypt==0.1.1.dev1", "tigrbl==0.4.5.dev8", "tba-contracts-identity==0.4.0.dev3", "tba-provider-identity-jose==0.4.0.dev3", "tba-storage-core==0.4.0.dev5", "tba-runtime-identity-storage==0.4.0.dev3", "tba-protocol-webauthn==0.4.0.dev3", "tba-protocol-cwt==0.4.0.dev4", "tba-profile-credential-vc-jose-cose==0.4.0.dev3", "tba-protocol-identity-did-core==0.4.0.dev3", "tba-capability-protected-envelope==0.4.0.dev3", "tba-protocol-security-cose==0.4.0.dev3", "tba-protocol-security-jws==0.4.0.dev3", "tba-profile-workload-credential-cwt-svid-extension==0.4.0.dev3", "tba-capability-public-key-registration==0.4.0.dev3", "tba-capability-public-key-authentication==0.4.0.dev3", "tba-capability-public-key-credential-management==0.4.0.dev3"]
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
uvicorn = ["uvicorn[standard]==0.41.0"]
hypercorn = ["hypercorn==0.18.0"]
tigrcorn = ["tigrcorn==0.3.8; python_version >= '3.11'"]
servers = ["uvicorn[standard]==0.41.0", "hypercorn==0.18.0", "tigrcorn==0.3.8; python_version >= '3.11'"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/060-runtime/tba-runtime-identity#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/060-runtime/tba-runtime-identity"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-runtime-identity/"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/060-runtime/tba-runtime-identity#readme"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_runtime_identity", from = "src" }]
include = ["src/tba_runtime_identity/profiles/*.yaml"]
