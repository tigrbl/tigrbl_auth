[project]
name = "tba-provider-dns-resolver"
version = "0.4.0.dev3"
description = "In-house DNS resolver and encrypted network transports."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = [
    "tba-primitives-dns-name==0.4.0.dev3",
    "tba-codec-dns==0.4.0.dev3",
]

[project.optional-dependencies]
http2 = ["httpx[http2]>=0.28,<1", "httpcore>=1,<2", "anyio>=4.7,<5"]
quic = ["aioquic>=1.3,<2", "pyOpenSSL>=25"]
trio = ["trio>=0.30,<1"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_dns_resolver", from = "src" }]
