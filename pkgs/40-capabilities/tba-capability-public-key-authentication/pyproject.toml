[project]
name = "tba-capability-public-key-authentication"
version = "0.4.0.dev2"
description = "Composable protocol-neutral public-key assertion authentication capability."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-concrete-capability==0.4.0.dev2", "tba-contracts-identity==0.4.0.dev2"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_capability_public_key_authentication", from = "src" }]
