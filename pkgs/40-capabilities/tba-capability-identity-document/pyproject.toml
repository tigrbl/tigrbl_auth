[project]
name = "tba-capability-identity-document"
version = "0.4.0.dev2"
description = "Identity document resolution, verification, and optional publication capability."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-concrete-capability==0.4.0.dev2",
    "tba-contracts-identity-document==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_capability_identity_document", from = "src" }]
