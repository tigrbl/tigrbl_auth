[project]
name = "tba-capability-password-authentication"
version = "0.4.0.dev2"
readme = "README.md"
description = "Password authentication capability."
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = "Apache-2.0"
dependencies = ["tba-concrete-capability==0.4.0.dev2", "tba-contracts-identity==0.4.0.dev2", "tba-provider-authenticator-password-local==0.1.0"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_capability_password_authentication", from = "src" }]
