[project]
name = "tba-capability-api-key-authentication"
version = "0.4.0.dev2"
description = "API-key authentication capability."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-concrete-capability==0.4.0.dev2", "tba-contracts-identity==0.4.0.dev2", "tba-provider-authenticator-api-key-local==0.1.0"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_capability_api_key_authentication", from = "src" }]
