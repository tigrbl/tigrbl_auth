[project]
name = "tba-capability-policy-administration"
version = "0.4.0.dev4"
readme = "README.md"
description = "Policy administration and simulation capability."
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
license = "Apache-2.0"
dependencies = ["tba-provider-policy-administration-memory==0.4.0.dev5", "tba-concrete-capability==0.4.0.dev4", "tba-concrete-authorization-policy-rules==0.4.0.dev4", "tba-contracts-identity==0.4.0.dev4", "tba-primitives-identity==0.4.0.dev4", "tba-durability-authorization-policy==0.4.0.dev4"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/40-capabilities/tba-capability-policy-administration#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/40-capabilities/tba-capability-policy-administration#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/40-capabilities/tba-capability-policy-administration"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-capability-policy-administration/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_capability_policy_administration", from = "src" }]
