[project]
name = "tba-capability-policy-administration"
version = "0.4.0.dev2"
readme = "README.md"
description = "Policy administration and simulation capability."
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = "Apache-2.0"
dependencies = [
    "tba-provider-policy-administration-memory==0.4.0.dev3",
    "tba-concrete-capability==0.4.0.dev2",
    "tba-concrete-authorization-policy-rules==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-durability-authorization-policy==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_capability_policy_administration", from = "src" }]
