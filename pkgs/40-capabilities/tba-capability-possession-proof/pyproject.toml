[project]
name = "tba-capability-possession-proof"
version = "0.4.0.dev2"
description = "Possession proof issue, verification, confirmation-key, and context-binding capability."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-concrete-capability==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-contracts-proof-of-possession==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_capability_possession_proof", from = "src" }]
