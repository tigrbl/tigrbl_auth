[project]
name = "tba-concrete-sd-jwt"
version = "0.4.0.dev2"
description = "Deterministic selective-disclosure JWT behavior."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-concrete-jose==0.4.0.dev2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_sd_jwt", from = "src" }]
