[project]
name = "tba-concrete-pkce"
version = "0.4.0.dev2"
description = "Deterministic RFC 7636 PKCE S256 implementation."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-bases-proof-of-possession==0.4.0.dev2", "tba-contracts-security-trust==0.1.0"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_pkce", from = "src" }]
