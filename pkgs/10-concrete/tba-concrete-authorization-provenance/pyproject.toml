[project]
name = "tba-concrete-authorization-provenance"
version = "0.4.0.dev2"
readme = "README.md"
description = "Deterministic authorization and delegation provenance builders."
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = "Apache-2.0"
dependencies = ["tba-primitives-identity==0.4.0.dev2", "tba-bases-security-provenance==0.1.0", "tba-contracts-security-trust==0.1.0"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_authorization_provenance", from = "src" }]
