[project]
name = "tba-concrete-acr-evaluator-basic"
version = "0.4.0.dev2"
readme = "README.md"
description = "Deterministic basic ACR evaluator."
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = "Apache-2.0"
dependencies = ["tba-contracts-security-trust==0.1.0", "tba-bases-authentication-context==0.4.0.dev2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_acr_evaluator_basic", from = "src" }]
