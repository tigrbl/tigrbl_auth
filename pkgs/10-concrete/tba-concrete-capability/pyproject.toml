[project]
name = "tba-concrete-capability"
version = "0.4.0.dev2"
description = "Neutral generic capability implementation for TBA identity."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-bases-capability==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-primitives-identity==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_capability", from = "src" }]
