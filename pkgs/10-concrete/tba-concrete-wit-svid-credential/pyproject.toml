[project]
name = "tba-concrete-wit-svid-credential"
version = "0.4.0.dev2"
description = "Standalone SPIFFE WIT-SVID credential object."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-bases-digital-credential==0.4.0.dev2",
    "tba-concrete-wit==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_wit_svid_credential", from = "src" }]
