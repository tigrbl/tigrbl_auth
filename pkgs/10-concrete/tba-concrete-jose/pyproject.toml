[project]
name = "tba-concrete-jose"
version = "0.4.0.dev2"
description = "Deterministic provider-free JOSE behavior."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-contracts-identity==0.4.0.dev2",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-bases-jose==0.4.0.dev2",
    "tba-contracts-security-key-rotation-policy==0.1.0",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_jose", from = "src" }]
