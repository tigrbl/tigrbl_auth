[project]
name = "tba-concrete-dns-zone"
version = "0.4.0.dev2"
description = "In-memory and B-tree DNS zones and transactions."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = [
    "tba-primitives-dns-name==0.4.0.dev2",
    "tba-codec-dns==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_dns_zone", from = "src" }]
