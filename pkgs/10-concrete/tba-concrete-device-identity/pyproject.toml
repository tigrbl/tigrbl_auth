[project]
name = "tba-concrete-device-identity"
version = "0.4.0.dev2"
description = "Standalone concrete device identity model."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-contracts-identity==0.4.0.dev2", "tba-bases-identity==0.4.0.dev2"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_concrete_device_identity", from = "src" }]
