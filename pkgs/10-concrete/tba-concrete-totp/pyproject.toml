[project]
name = "tba-concrete-totp"
version = "0.1.0"
description = "Stateless HOTP and TOTP algorithms for TBA."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_totp", from = "src" }]
