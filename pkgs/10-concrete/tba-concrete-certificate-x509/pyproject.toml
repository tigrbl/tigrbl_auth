[project]
name = "tba-concrete-certificate-x509"
version = "0.4.0.dev2"
readme = "README.md"
requires-python = ">=3.10,<3.16"
dependencies = ["cryptography>=45"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_certificate_x509", from = "src" }]
