[project]
name = "tba-concrete-claim-access-token-digest"
version = "0.4.0.dev2"
description = "Standalone RFC 9449 ath claim implementation."
requires-python = ">=3.10,<3.15"
dependencies = [
    "tba-primitives-identity==0.4.0.dev2",
    "tba-bases-claim==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_claim_access_token_digest", from = "src" }]
