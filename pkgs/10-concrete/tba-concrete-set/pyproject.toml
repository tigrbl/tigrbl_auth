[project]
name = "tba-concrete-set"
version = "0.4.0.dev2"
description = "RFC 8417 Security Event Token claims and validation for TBA."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-primitives-identity==0.4.0.dev2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_set", from = "src" }]
