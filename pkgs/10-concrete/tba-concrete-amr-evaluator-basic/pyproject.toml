[project]
name = "tba-concrete-amr-evaluator-basic"
version = "0.4.0.dev2"
description = "Deterministic basic AMR evaluator."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-contracts-security-trust==0.1.0", "tba-bases-authentication-context==0.4.0.dev2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_amr_evaluator_basic", from = "src" }]
