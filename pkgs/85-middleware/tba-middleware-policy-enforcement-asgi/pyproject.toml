[project]
name = "tba-middleware-policy-enforcement-asgi"
version = "0.4.0.dev4"
description = "ASGI policy enforcement point using an injected decision client."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
]
license = "Apache-2.0"
dependencies = ["tba-client-policy-decision==0.4.0.dev4"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/85-middleware/tba-middleware-policy-enforcement-asgi#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/85-middleware/tba-middleware-policy-enforcement-asgi#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/85-middleware/tba-middleware-policy-enforcement-asgi"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-middleware-policy-enforcement-asgi/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_middleware_policy_enforcement_asgi", from = "src" }]
