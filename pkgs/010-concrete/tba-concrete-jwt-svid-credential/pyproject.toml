[project]
name = "tba-concrete-jwt-svid-credential"
version = "0.4.0.dev3"
description = "Standalone JWT-SVID credential object."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
license = "Apache-2.0"
dependencies = ["tba-bases-digital-credential==0.4.0.dev3", "tba-concrete-jwt==0.4.0.dev3", "tba-concrete-svid==0.4.0.dev3", "tba-contracts-workload-identity==0.4.0.dev3"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/010-concrete/tba-concrete-jwt-svid-credential#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/010-concrete/tba-concrete-jwt-svid-credential#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/010-concrete/tba-concrete-jwt-svid-credential"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-concrete-jwt-svid-credential/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_jwt_svid_credential", from = "src" }]
