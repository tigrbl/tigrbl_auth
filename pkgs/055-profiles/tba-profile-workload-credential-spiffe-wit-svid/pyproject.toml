[project]
name="tba-profile-workload-credential-spiffe-wit-svid"
version="0.4.0.dev3"
description = "Incubating SPIFFE WIT-SVID profile pinned to the SPIFFE v1.15.1 publication."
license = "Apache-2.0"
readme = "README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
dependencies = ["tba-contracts-proof-of-possession==0.4.0.dev3", "tba-profile-workload-credential-wimse-wit==0.4.0.dev5", "tba-protocol-workload-spiffe-svid==0.4.0.dev3", "tba-profile-workload-proof-wimse-wpt==0.4.0.dev5", "tba-concrete-jwt==0.4.0.dev3", "tba-provider-jose-cryptography==0.4.0.dev5"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/055-profiles/tba-profile-workload-credential-spiffe-wit-svid#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/055-profiles/tba-profile-workload-credential-spiffe-wit-svid#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/055-profiles/tba-profile-workload-credential-spiffe-wit-svid"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-profile-workload-credential-spiffe-wit-svid/"
[build-system]
requires=["poetry-core>=2.2.0,<3.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_profile_workload_credential_spiffe_wit_svid",from="src"}]
