[project]
name = "tba-app-backend-wit-issuance"
version = "0.4.0.dev2"
description = "Deployable WIMSE WIT issuance with explicit enrollment and key policy."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = [
    "tigrbl==0.4.5.dev8",
    "tba-provider-jose-cryptography==0.4.0.dev3",
    "tba-router-wit-issuance==0.4.0.dev2",
    "tba-runtime-identity==0.4.0.dev3",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_app_backend_wit_issuance", from = "src" }]
