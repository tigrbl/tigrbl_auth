[project]
name = "tba-app-backend-wit-issuance"
version = "0.4.0.dev4"
description = "Deployable WIMSE WIT issuance with explicit enrollment and key policy."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = ["tigrbl==0.4.5.dev8", "tba-provider-jose-cryptography==0.4.0.dev5", "tba-router-wit-issuance==0.4.0.dev4", "tba-runtime-identity==0.4.0.dev5"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/90-backend-apps/tba-app-backend-wit-issuance#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/90-backend-apps/tba-app-backend-wit-issuance#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/90-backend-apps/tba-app-backend-wit-issuance"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-app-backend-wit-issuance/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_app_backend_wit_issuance", from = "src" }]
