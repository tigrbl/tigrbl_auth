[project]
name = "tigrbl-auth-backend-app-rp"
version = "0.4.0.dev3"
description = "Deployable secure RP/BFF composition."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tigrbl-auth-router-rp-session==0.4.0.dev3"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{include = "tigrbl_auth_backend_app_rp", from = "src"}]
