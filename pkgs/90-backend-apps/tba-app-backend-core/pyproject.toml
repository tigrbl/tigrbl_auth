[project]
name = "tba-app-backend-core"
version = "0.4.0.dev3"
description = "Shared layer-90 ASGI and router composition for TBA backend applications."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
license = "Apache-2.0"
dependencies = ["tigrbl==0.4.5.dev8", "tba-protocol-gnap==0.4.0.dev3", "tba-protocol-oauth==0.4.0.dev3", "tba-plugin-tigrbl==0.4.0.dev3", "tba-router-administration-gate==0.4.0.dev3", "tba-router-oauth-authorization==0.4.0.dev3", "tba-router-oauth-authorization-server-metadata==0.4.0.dev3", "tba-router-oauth-device-authorization==0.4.0.dev3", "tba-router-oauth-introspection==0.4.0.dev3", "tba-router-oauth-pushed-authorization-request==0.4.0.dev3", "tba-router-oauth-protected-resource-metadata==0.4.0.dev3", "tba-router-oauth-registration==0.4.0.dev3", "tba-router-oauth-revocation==0.4.0.dev3", "tba-router-oauth-token==0.4.0.dev3", "tba-router-oauth-token-exchange==0.4.0.dev3", "tba-router-oidc-discovery==0.4.0.dev3", "tba-router-oidc-logout==0.4.0.dev3", "tba-router-oidc-userinfo==0.4.0.dev3", "tba-router-resource-validation-metadata==0.4.0.dev3", "tba-router-session-login==0.4.0.dev3", "tba-capability-client-secret-authentication==0.4.0.dev3", "tba-contracts-identity==0.4.0.dev3", "tba-primitives-identity==0.4.0.dev3", "tba-operator-identity==0.4.0.dev3", "tba-runtime-identity==0.4.0.dev4", "tba-server-identity==0.4.0.dev3", "tba-storage-core==0.4.0.dev5", "tba-storage-oauth==0.4.0.dev3", "tba-storage-tenancy==0.4.0.dev3", "tba-runtime-identity-storage==0.4.0.dev3", "tba-provider-secret-hashing-bcrypt==0.1.1.dev1"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[project.entry-points."tba_auth.app_factories"]
default = "tba_app_backend_core.app:build_app"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/90-backend-apps/tba-app-backend-core#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/90-backend-apps/tba-app-backend-core"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/90-backend-apps/tba-app-backend-core#readme"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-app-backend-core/"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_app_backend_core", from = "src" }]
