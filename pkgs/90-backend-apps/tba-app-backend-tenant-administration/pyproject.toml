[project]
name = "tba-app-backend-tenant-administration"
version = "0.4.0.dev2"
description = "Tenant-scoped administration backend application for TBA."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-auth==0.4.0.dev2",
    "tba-app-backend-core==0.4.0.dev2",
    "tba-router-administration-gate==0.4.0.dev2",
]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/90-backend-apps/tba-app-backend-tenant-administration"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_app_backend_tenant_administration", from = "src" }]
