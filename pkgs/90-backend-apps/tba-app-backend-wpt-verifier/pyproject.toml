[project]
name = "tba-app-backend-wpt-verifier"
version = "0.4.0.dev2"
description = "Deployable delegated WIT/WPT verification with recipient policy and replay protection."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = [
    "tigrbl==0.4.5.dev8",
    "tba-contracts-replay==0.4.0.dev2",
    "tba-profile-workload-proof-wimse-wpt==0.4.0.dev4",
    "tba-router-wpt-verification==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_app_backend_wpt_verifier", from = "src" }]
