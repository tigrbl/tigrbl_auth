[project]
name = "tba-app-backend-developer"
version = "0.4.0.dev4"
description = "Developer OIDC/OAuth backend application for TBA."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
license = "Apache-2.0"
dependencies = ["tba-auth==0.4.0.dev4", "tba-app-backend-core==0.4.0.dev4", "tba-router-administration-gate==0.4.0.dev4", "tba-router-oauth-authorization-server-metadata==0.4.0.dev4", "tba-router-oauth-registration==0.4.0.dev4", "tba-router-oidc-discovery==0.4.0.dev4"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/90-backend-apps/tba-app-backend-developer#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/90-backend-apps/tba-app-backend-developer"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/90-backend-apps/tba-app-backend-developer#readme"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-app-backend-developer/"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_app_backend_developer", from = "src" }]
