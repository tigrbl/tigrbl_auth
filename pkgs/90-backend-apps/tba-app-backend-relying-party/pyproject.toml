[project]
name = "tba-app-backend-relying-party"
version = "0.4.0.dev3"
description = "Deployable secure RP/BFF composition."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-router-relying-party-session==0.4.0.dev3"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{include = "tba_app_backend_relying_party", from = "src"}]
