[project]
name = "tba-app-backend-wic-ca"
version = "0.4.0.dev2"
description = "Deployable native WIMSE Workload Identity Certificate authority."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = [
    "tigrbl==0.4.5.dev8",
    "tba-provider-certificate-issuer-x509==0.4.0.dev2",
    "tba-router-wic-ca==0.4.0.dev2",
    "tba-runtime-identity==0.4.0.dev3",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_app_backend_wic_ca", from = "src" }]
