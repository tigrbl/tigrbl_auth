[project]
name = "tba-client-policy-decision"
version = "0.4.0.dev3"
description = "Typed client for platform authorization decisions."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-contracts-authorization==0.4.0.dev3"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_client_policy_decision", from = "src" }]
