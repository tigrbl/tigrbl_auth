[project]
name = "tigrbl-policy-decision-client"
version = "0.4.0.dev3"
description = "Typed client for platform authorization decisions."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tigrbl-authorization-contracts==0.4.0.dev3"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tigrbl_policy_decision_client", from = "src" }]
