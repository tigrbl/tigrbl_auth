[project]
name = "tigrbl-policy-enforcement-asgi"
version = "0.4.0.dev3"
description = "ASGI policy enforcement point using an injected decision client."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tigrbl-policy-decision-client==0.4.0.dev3"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tigrbl_policy_enforcement_asgi", from = "src" }]
