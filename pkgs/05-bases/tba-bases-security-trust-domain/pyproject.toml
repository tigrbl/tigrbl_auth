[project]
name = "tba-bases-security-trust-domain"
version = "0.1.0"
description = "Draft domain base classes composed from tigrbl security/trust contracts."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["tigrbl", "security", "trust", "domain-bases", "crypto", "signing", "tokens", "certificates", "cipher-suites"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Security",
]
dependencies = [
    "tba-bases-certificate==0.4.0.dev2",
    "tba-bases-capability==0.4.0.dev2",
    "tba-bases-did==0.4.0.dev2",
    "tba-bases-encryption==0.4.0.dev2",
    "tba-bases-claim==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-bases-identity==0.4.0.dev2",
    "tba-bases-authentication-context==0.4.0.dev2",
    "tba-bases-protected-artifact==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
    "tba-bases-key==0.4.0.dev2",
    "tba-bases-proof-of-possession==0.4.0.dev2",
    "tba-bases-signing==0.4.0.dev2",
    "tba-bases-token-introspection==0.4.0.dev2",
    "tba-bases-trust==0.4.0.dev2",
    "tba-bases-workload-identity==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_bases_security_trust_domain", from = "src" }]
