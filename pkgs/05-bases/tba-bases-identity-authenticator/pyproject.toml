[project]
name = "tba-bases-identity-authenticator"
version = "0.1.0"
description = "Compatibility facade for authenticator bases."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-bases-authenticator==0.1.0"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_bases_identity_authenticator", from = "src" }]
