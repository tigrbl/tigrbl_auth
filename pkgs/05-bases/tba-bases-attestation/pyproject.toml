[project]
name = "tba-bases-attestation"
version = "0.4.0.dev2"
description = "Protocol-neutral remote attestation bases."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-contracts-attestation==0.4.0.dev2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_bases_attestation", from = "src" }]
