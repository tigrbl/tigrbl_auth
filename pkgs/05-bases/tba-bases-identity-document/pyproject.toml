[project]
name = "tba-bases-identity-document"
version = "0.4.0.dev2"
description = "Protocol-neutral identity-document resolution, publication, and verification bases."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-contracts-identity-document==0.4.0.dev2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_bases_identity_document", from = "src" }]