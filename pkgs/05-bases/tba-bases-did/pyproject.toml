[project]
name = "tba-bases-did"
version = "0.4.0.dev2"
description = "Reusable DID resolution and dereferencing bases."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-contracts-did==0.4.0.dev2"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_bases_did", from = "src" }]
