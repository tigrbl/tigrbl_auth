[project]
name = "tba-bases-security-artifact"
version = "0.4.0.dev2"
description = "Compatibility facade for protected artifact bases."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-bases-protected-artifact==0.4.0.dev2"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_bases_security_artifact", from = "src" }]
