[project]
name = "tba-bases-key"
version = "0.4.0.dev2"
description = "Reusable key lifecycle, resolution, wrapping, and export bases."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-contracts-security-trust==0.1.0", "tba-bases-signing==0.4.0.dev2"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_bases_key", from = "src" }]
