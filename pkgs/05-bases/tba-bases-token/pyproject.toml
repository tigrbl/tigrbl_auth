[project]
name = "tba-bases-token"
version = "0.4.0.dev2"
description = "Protocol-neutral profiled token bases."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-contracts-token==0.4.0.dev2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_bases_token", from = "src" }]