[project]
name = "tba-bases-proof-of-possession"
version = "0.4.0.dev4"
description = "Reusable proof-of-possession issuance, verification, key-resolution, and context-binding bases."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
license = "Apache-2.0"
dependencies = ["tba-contracts-proof-of-possession==0.4.0.dev4", "tba-bases-protected-artifact==0.4.0.dev4", "tba-contracts-security-trust==0.1.1.dev2"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/05-bases/tba-bases-proof-of-possession#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/05-bases/tba-bases-proof-of-possession#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/05-bases/tba-bases-proof-of-possession"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-bases-proof-of-possession/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_bases_proof_of_possession", from = "src" }]