[project]
name = "tba-bases-proof-of-possession"
version = "0.4.0.dev2"
description = "Reusable proof-of-possession issuance, verification, key-resolution, and context-binding bases."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-contracts-proof-of-possession==0.4.0.dev2",
    "tba-bases-protected-artifact==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_bases_proof_of_possession", from = "src" }]