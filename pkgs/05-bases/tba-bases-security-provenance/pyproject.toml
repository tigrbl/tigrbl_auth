[project]
name = "tba-bases-security-provenance"
version = "0.1.0"
description = "Base classes for authorization provenance providers."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-bases-capability==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_bases_security_provenance", from = "src" }]
