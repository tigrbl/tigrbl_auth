[project]
name = "tba-bases-trust"
version = "0.4.0.dev2"
description = "Reusable issuer and wallet trust resolution bases."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-contracts-security-trust==0.1.0"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_bases_trust", from = "src" }]
