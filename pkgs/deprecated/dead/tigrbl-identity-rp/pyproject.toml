[project]
name = "tigrbl-identity-rp"
version = "0.4.0.dev3"
description = "Deprecated compatibility package. Migrate to tba-protocol-oidc-relying-party; see the included module migration table."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "identity",
    "openid-connect",
    "oidc",
    "relying-party",
    "rp",
    "userinfo",
    "logout",
    "sso",
    "iam",
]
classifiers = ["Intended Audience :: Developers", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Typing :: Typed", "Topic :: Internet :: WWW/HTTP", "Topic :: Security", "Topic :: Software Development :: Libraries :: Python Modules", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Development Status :: 7 - Inactive"]

dependencies = ["tba-protocol-oidc-relying-party>=0.4.0.dev2,<0.5"]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/tigrbl-identity-rp%3D%3D0.4.0.dev3/pkgs/deprecated/undead/tigrbl-identity-rp#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/tigrbl-identity-rp%3D%3D0.4.0.dev3/pkgs/deprecated/undead/tigrbl-identity-rp"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tigrbl-identity-rp/"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/tigrbl-identity-rp%3D%3D0.4.0.dev3/pkgs/deprecated/undead/tigrbl-identity-rp#readme"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
Replacement = "https://pypi.org/project/tba-protocol-oidc-relying-party/"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tigrbl_identity_rp", from = "src" }]
