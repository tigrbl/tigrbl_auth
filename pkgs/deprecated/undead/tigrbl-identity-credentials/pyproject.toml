[project]
name = "tigrbl-identity-credentials"
version = "0.4.0.dev3"
description = "Deprecated compatibility package. Migrate to tba-credentials; see the included module migration table."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "identity",
    "credentials",
    "authentication",
    "passwords",
    "api-keys",
    "sessions",
    "tokens",
    "iam",
    "authn",
]
classifiers = ["Intended Audience :: Developers", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Typing :: Typed", "Topic :: Internet :: WWW/HTTP", "Topic :: Security", "Topic :: Software Development :: Libraries :: Python Modules", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Development Status :: 7 - Inactive"]
dependencies = ["tba-credentials>=0.4.0.dev2,<0.5", "tba-provider-identity-jose>=0.4.0.dev2,<0.5", "tba-runtime-identity>=0.4.0.dev2,<0.5", "tba-runtime-identity-storage>=0.4.0.dev2,<0.5", "tba-server-identity>=0.4.0.dev3,<0.5"]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/tigrbl-identity-credentials%3D%3D0.4.0.dev3/pkgs/deprecated/undead/tigrbl-identity-credentials#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/tigrbl-identity-credentials%3D%3D0.4.0.dev3/pkgs/deprecated/undead/tigrbl-identity-credentials"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tigrbl-identity-credentials/"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/tigrbl-identity-credentials%3D%3D0.4.0.dev3/pkgs/deprecated/undead/tigrbl-identity-credentials#readme"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
Replacement = "https://pypi.org/project/tba-credentials/"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tigrbl_identity_credentials", from = "src" }]
