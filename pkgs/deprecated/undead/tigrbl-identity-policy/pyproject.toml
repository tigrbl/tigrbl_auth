[project]
name = "tigrbl-identity-policy"
version = "0.4.0.dev3"
description = "Deprecated compatibility package. Migrate to tba-runtime-authorization-policy; see the included module migration table."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "identity",
    "authorization",
    "rbac",
    "abac",
    "delegated-admin",
    "policy",
    "iam",
    "service-identity",
    "governance",
]
classifiers = ["Intended Audience :: Developers", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Typing :: Typed", "Topic :: Internet :: WWW/HTTP", "Topic :: Security", "Topic :: Software Development :: Libraries :: Python Modules", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Development Status :: 7 - Inactive"]

dependencies = ["tba-certification-release>=0.4.0.dev2,<0.5", "tba-router-administration-gate>=0.4.0.dev2,<0.5", "tba-runtime-authorization-policy>=0.4.0.dev2,<0.5"]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/tigrbl-identity-policy%3D%3D0.4.0.dev3/pkgs/deprecated/undead/tigrbl-identity-policy#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/tigrbl-identity-policy%3D%3D0.4.0.dev3/pkgs/deprecated/undead/tigrbl-identity-policy"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tigrbl-identity-policy/"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/tigrbl-identity-policy%3D%3D0.4.0.dev3/pkgs/deprecated/undead/tigrbl-identity-policy#readme"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
Replacement = "https://pypi.org/project/tba-runtime-authorization-policy/"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tigrbl_identity_policy", from = "src" }]
