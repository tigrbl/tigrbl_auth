[project]
name = "tigrbl-authn-credentials"
version = "0.4.0.dev2"
description = "Deprecated compatibility package for tigrbl-credentials."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tigrbl-credentials==0.4.0.dev2"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/deprecated/tigrbl-authn-credentials"
PyPI = "https://pypi.org/project/tigrbl-authn-credentials/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tigrbl_authn_credentials", from = "src" }]
