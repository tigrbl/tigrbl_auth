[project]
name = "tba-runtime-authorization-policy"
version = "0.4.0.dev5"
description = "Authorization policy, authority, grants, permissions, decisions, and governance implementation package for the TBA package suite."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "authz",
    "authorization",
    "policy",
    "rbac",
    "abac",
    "delegated-admin",
    "permissions",
    "decisions",
    "iam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["tba-provider-authorization-policy-decision-engine==0.4.0.dev4", "tba-capability-access-governance==0.4.0.dev4", "tba-capability-policy-administration==0.4.0.dev4", "tba-capability-policy-assurance==0.4.0.dev4", "tba-concrete-authorization-policy-rules==0.4.0.dev4", "tba-provider-security-authorization-provenance-builder==0.1.1.dev2", "tigrbl==0.4.5.dev8", "tba-primitives-identity==0.4.0.dev4", "tba-contracts-identity==0.4.0.dev4", "tba-concrete-authority-graph==0.4.0.dev4", "tba-concrete-policy-decision-engine-default==0.4.0.dev4", "tba-contracts-release==0.1.1.dev2"]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/60-runtime/tba-runtime-authorization-policy#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/60-runtime/tba-runtime-authorization-policy"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-runtime-authorization-policy/"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/60-runtime/tba-runtime-authorization-policy#readme"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_runtime_authorization_policy", from = "src" }]
