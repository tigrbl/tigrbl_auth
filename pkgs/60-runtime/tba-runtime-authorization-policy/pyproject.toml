[project]
name = "tba-runtime-authorization-policy"
version = "0.4.0.dev2"
description = "Authorization policy, authority, grants, permissions, decisions, and governance implementation package for the TBA package suite."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "authz",
    "authorization",
    "policy",
    "rbac",
    "abac",
    "delegated-admin",
    "permissions",
    "decisions",
    "iam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tba-capability-access-governance==0.4.0.dev2",
    "tba-capability-policy-administration==0.4.0.dev2",
    "tba-capability-policy-assurance==0.4.0.dev2",
    "tba-concrete-authorization-policy-rules==0.4.0.dev2",
    "tba-provider-security-authorization-provenance-builder==0.1.0",
    "tigrbl==0.4.5.dev4",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-concrete-authority-graph==0.4.0.dev2",
    "tba-concrete-policy-decision-engine-default==0.4.0.dev2",
    "tba-contracts-release==0.1.0",
]
[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/60-runtime/tba-runtime-authorization-policy"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-runtime-authorization-policy/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_runtime_authorization_policy", from = "src" }]
