[project]
name = "tba-runtime-identity"
version = "0.4.0.dev2"
description = "Runtime assembly, profile loading, feature flags, deployment resolution, runner adapters, and diagnostics for TBA identity apps."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "identity",
    "runtime",
    "asgi",
    "uvicorn",
    "hypercorn",
    "tigrcorn",
    "feature-flags",
    "deployment-profile",
    "iam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tba-provider-secret-hashing-bcrypt==0.1.0",
    "tigrbl==0.4.5.dev4",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-provider-identity-jose==0.4.0.dev2",
    "tba-storage-core==0.4.0.dev2",
    "tba-runtime-identity-storage==0.4.0.dev2",
    "tba-protocol-webauthn==0.4.0.dev2",
    "tba-protocol-cwt==0.4.0.dev2",
    "tba-profile-credential-vc-jose-cose==0.4.0.dev2",
    "tba-protocol-identity-did-core==0.4.0.dev2",
    "tba-capability-protected-envelope==0.4.0.dev2",
    "tba-protocol-security-cose==0.4.0.dev2",
    "tba-protocol-security-jws==0.4.0.dev2",
    "tba-profile-workload-credential-cwt-svid-extension==0.4.0.dev2",
    "tba-capability-public-key-registration==0.4.0.dev2",
    "tba-capability-public-key-authentication==0.4.0.dev2",
    "tba-capability-public-key-credential-management==0.4.0.dev2",
]

[project.optional-dependencies]
uvicorn = [
    "uvicorn[standard]==0.41.0",
]
hypercorn = [
    "hypercorn==0.18.0",
]
tigrcorn = [
    "tigrcorn==0.3.8; python_version >= '3.11'",
]
servers = [
    "uvicorn[standard]==0.41.0",
    "hypercorn==0.18.0",
    "tigrcorn==0.3.8; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/60-runtime/tba-runtime-identity"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-runtime-identity/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_runtime_identity", from = "src" }]
include = ["src/tba_runtime_identity/profiles/*.yaml"]
