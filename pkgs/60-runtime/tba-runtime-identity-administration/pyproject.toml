[project]
name = "tba-runtime-identity-administration"
version = "0.4.0.dev2"
description = "Administrative identity control plane for tenants, users, clients, keys, sessions, tokens, audit, consent, profiles, and governance."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "identity",
    "admin",
    "control-plane",
    "iam",
    "tenant-management",
    "client-management",
    "audit",
    "governance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tba-capability-adaptive-authentication==0.4.0.dev2",
    "tba-capability-administrative-resource==0.4.0.dev2",
    "tba-capability-identity-administration==0.4.0.dev2",
    "tba-capability-operator-administration==0.4.0.dev2",
    "tba-capability-realm-administration==0.4.0.dev2",
    "tba-capability-tenant-administration==0.4.0.dev2",
    "tba-concrete-capability==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-concrete-mfa-factor==0.4.0.dev2",
    "tba-concrete-passwordless-credential==0.4.0.dev2",
    "tba-concrete-webauthn-credential==0.4.0.dev2",
    "tba-concrete-device-identity==0.4.0.dev2",
    "tba-concrete-workload-identity==0.4.0.dev2",
    "tba-concrete-jose==0.4.0.dev2",
    "tba-durability-identity==0.4.0.dev2",
    "tba-durability-webauthn==0.4.0.dev2",
    "tba-durability-authorization-policy==0.4.0.dev2",
    "tba-provider-identity-administration-relationship-graph==0.4.0.dev2",
    "tba-provider-authentication-anomaly-detector==0.4.0.dev2",
    "tba-concrete-trust-federation-graph==0.4.0.dev2",
    "tba-server-identity==0.4.0.dev2",
]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/60-runtime/tba-runtime-identity-administration"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-runtime-identity-administration/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_runtime_identity_administration", from = "src" }]
