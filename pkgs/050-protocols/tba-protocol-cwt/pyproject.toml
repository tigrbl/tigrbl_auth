[project]
name="tba-protocol-cwt"
version="0.4.0.dev4"
license = "Apache-2.0"
description="Versioned RFC 8392 CWT claim-set composition."
readme="README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
dependencies=["tba-primitives-identity==0.4.0.dev3", "tba-concrete-claim-authorization-context==0.4.0.dev3", "tba-concrete-claim-access-token-digest==0.4.0.dev4", "tba-concrete-cwt==0.4.0.dev4", "tba-contracts-identity==0.4.0.dev3", "tba-bases-claim==0.4.0.dev3", "tba-concrete-claim-issuer==0.4.0.dev3", "tba-concrete-claim-subject==0.4.0.dev3", "tba-concrete-claim-audience==0.4.0.dev3", "tba-concrete-claim-expiration==0.4.0.dev3", "tba-concrete-claim-not-before==0.4.0.dev3", "tba-concrete-claim-issued-at==0.4.0.dev3", "tba-concrete-claim-jwt-id==0.4.0.dev3"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/050-protocols/tba-protocol-cwt#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/050-protocols/tba-protocol-cwt#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/050-protocols/tba-protocol-cwt"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-protocol-cwt/"
[build-system]
requires=["poetry-core>=2.2.0,<3.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_protocol_cwt",from="src"}]
