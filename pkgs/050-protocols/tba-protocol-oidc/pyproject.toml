[project]
name = "tba-protocol-oidc"
version = "0.4.0.dev3"
description = "OpenID Connect provider protocol implementation package for the TBA package suite."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "auth",
    "protocol",
    "oidc",
    "openid-connect",
    "id-token",
    "userinfo",
    "discovery",
    "logout",
    "iam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["pydantic>=2.12.5,<3", "tba-protocol-oauth==0.4.0.dev3", "tba-contracts-identity==0.4.0.dev3", "tba-primitives-identity==0.4.0.dev3", "tba-provider-identity-jose==0.4.0.dev3", "tba-concrete-identity-assurance==0.4.0.dev3", "tba-provider-claims-local==0.1.1.dev1", "tba-concrete-public-subject-identifier==0.4.0.dev3", "tba-concrete-pairwise-subject-identifier==0.4.0.dev3", "tba-concrete-claim-authentication-time==0.4.0.dev3", "tba-concrete-claim-nonce==0.4.0.dev3", "tba-concrete-claim-authentication-context==0.4.0.dev3", "tba-concrete-claim-authentication-methods==0.4.0.dev3", "tba-concrete-claim-authorized-party==0.4.0.dev3", "tba-concrete-claim-verified-claims==0.4.0.dev3", "tba-concrete-claim-place-of-birth==0.4.0.dev3", "tba-concrete-claim-nationalities==0.4.0.dev3", "tba-concrete-claim-birth-family-name==0.4.0.dev3", "tba-concrete-claim-birth-given-name==0.4.0.dev3", "tba-concrete-claim-birth-middle-name==0.4.0.dev3", "tba-concrete-claim-salutation==0.4.0.dev3", "tba-concrete-claim-title==0.4.0.dev3", "tba-concrete-claim-msisdn==0.4.0.dev3", "tba-concrete-claim-also-known-as==0.4.0.dev3", "tba-concrete-claim-address-country-code==0.4.0.dev3", "tba-concrete-claim-transaction-id==0.4.0.dev3", "tba-concrete-claim-name==0.4.0.dev3", "tba-concrete-claim-given-name==0.4.0.dev3", "tba-concrete-claim-family-name==0.4.0.dev3", "tba-concrete-claim-middle-name==0.4.0.dev3", "tba-concrete-claim-nickname==0.4.0.dev3", "tba-concrete-claim-preferred-username==0.4.0.dev3", "tba-concrete-claim-profile-uri==0.4.0.dev3", "tba-concrete-claim-picture-uri==0.4.0.dev3", "tba-concrete-claim-website-uri==0.4.0.dev3", "tba-concrete-claim-email==0.4.0.dev3", "tba-concrete-claim-email-verified==0.4.0.dev3", "tba-concrete-claim-gender==0.4.0.dev3", "tba-concrete-claim-birthdate==0.4.0.dev3", "tba-concrete-claim-zoneinfo==0.4.0.dev3", "tba-concrete-claim-locale==0.4.0.dev3", "tba-concrete-claim-phone-number==0.4.0.dev3", "tba-concrete-claim-phone-number-verified==0.4.0.dev3", "tba-concrete-claim-address==0.4.0.dev3", "tba-concrete-claim-updated-at==0.4.0.dev3", "tba-concrete-claim-access-token-hash==0.4.0.dev3", "tba-concrete-claim-authorization-code-hash==0.4.0.dev3", "tba-concrete-claim-state-hash==0.4.0.dev3", "tba-concrete-claim-session-id==0.4.0.dev3"]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/050-protocols/tba-protocol-oidc#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/050-protocols/tba-protocol-oidc"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-protocol-oidc/"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/050-protocols/tba-protocol-oidc#readme"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_protocol_oidc", from = "src" }]

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "tigrbl-auth"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl_auth"
ref = "master"
package_path = "pkgs/050-protocols/tba-protocol-oidc"
layer = "050-protocols"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tba-protocol-oidc"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/050-protocols/tba-protocol-oidc/docs/readme/test_examples.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/050-protocols/tba-protocol-oidc/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[dependency-groups]
dev = ["readme-standards==0.1.1; python_version >= \"3.11\""]
