[project]
name = "tba-protocol-oauth"
version = "0.4.0.dev3"
description = "OAuth 2.x and OAuth 2.1 profile protocol implementation package for the TBA package suite."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "auth",
    "protocol",
    "oauth",
    "oauth2",
    "oauth2.1",
    "par",
    "rar",
    "token-exchange",
    "dynamic-client-registration",
    "iam",
]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Typing :: Typed", "Topic :: Internet :: WWW/HTTP", "Topic :: Security", "Topic :: Software Development :: Libraries :: Python Modules", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15"]
dependencies = ["pydantic[email]==2.12.5", "tba-protocol-gnap==0.4.0.dev3", "tba-contracts-identity==0.4.0.dev3", "tba-capability-token-introspection==0.4.0.dev3", "tba-capability-token-issuance==0.4.0.dev3", "tba-capability-token-revocation==0.4.0.dev3", "tba-capability-authorization-request-staging==0.4.0.dev3", "tba-capability-client-registration==0.4.0.dev3", "tba-primitives-identity==0.4.0.dev3", "tba-provider-identity-jose==0.4.0.dev3", "tba-contracts-security-trust==0.1.1.dev1", "tba-provider-security-proof-pkce==0.1.1.dev1", "tba-concrete-authorization-scope-set-matcher==0.4.0.dev3", "tba-concrete-claim-client-id==0.4.0.dev3", "tba-concrete-claim-confirmation==0.4.0.dev3", "tba-concrete-claim-scope==0.4.0.dev3", "tba-concrete-claim-http-method==0.4.0.dev3", "tba-concrete-claim-http-uri==0.4.0.dev3", "tba-concrete-claim-access-token-digest==0.4.0.dev4", "tba-concrete-claim-actor==0.4.0.dev3", "tba-concrete-claim-may-act==0.4.0.dev3", "tba-concrete-claim-jwt-id==0.4.0.dev3", "tba-concrete-claim-issued-at==0.4.0.dev3", "tba-concrete-claim-nonce==0.4.0.dev3"]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/050-protocols/tba-protocol-oauth#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/050-protocols/tba-protocol-oauth"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-protocol-oauth/"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/050-protocols/tba-protocol-oauth#readme"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_protocol_oauth", from = "src" }]

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "tigrbl-auth"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl_auth"
ref = "master"
package_path = "pkgs/050-protocols/tba-protocol-oauth"
layer = "050-protocols"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tba-protocol-oauth"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/050-protocols/tba-protocol-oauth/docs/readme/test_examples.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/050-protocols/tba-protocol-oauth/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[dependency-groups]
dev = ["readme-standards==0.1.1; python_version >= \"3.11\""]
