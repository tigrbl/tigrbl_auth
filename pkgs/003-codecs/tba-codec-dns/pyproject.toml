[project]
name = "tba-codec-dns"
version = "0.4.0.dev3"
description = "DNS wire messages and type-specific resource record data codecs."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = ["tba-primitives-dns-name==0.4.0.dev3"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_codec_dns", from = "src" }]
