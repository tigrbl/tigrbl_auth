[project]
name = "tba-protocol-attestation-corim"
version = "0.4.0.dev2"
description = "Versioned CoRIM-family protocol profile and capability mapping."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-concrete-corim==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_protocol_attestation_corim", from = "src" }]
