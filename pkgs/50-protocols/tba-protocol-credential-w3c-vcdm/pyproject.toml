[project]
name="tba-protocol-credential-w3c-vcdm"
version="0.4.0.dev2"
description = "Version authority, feature selection, compatibility, migration, and semantic object mapping for W3C Verifiable Credentials Data Model revisions."
readme = "README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license="Apache-2.0"
dependencies=["tba-primitives-identity==0.4.0.dev2", "tba-concrete-verifiable-credential==0.4.0.dev2","tba-concrete-verifiable-presentation==0.4.0.dev2"]
[build-system]
requires=["poetry-core>=1.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_protocol_credential_w3c_vcdm",from="src"}]
