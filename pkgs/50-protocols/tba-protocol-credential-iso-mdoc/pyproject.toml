[project]
name="tba-protocol-credential-iso-mdoc"
version="0.4.0.dev2"
description = "Version authority, feature selection, compatibility, migration, and schema mapping for ISO/IEC 18013-5 mdoc artifacts."
readme = "README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license="Apache-2.0"
dependencies=["tba-primitives-identity==0.4.0.dev2", "tba-concrete-mdoc==0.4.0.dev2","tba-concrete-mdoc-credential==0.4.0.dev2", "tba-bases-digital-credential==0.4.0.dev2", "tba-contracts-identity==0.4.0.dev2", "tba-provider-mdoc-issuer==0.4.0.dev2", "tba-provider-mdoc-verifier==0.4.0.dev2"]
[build-system]
requires=["poetry-core>=1.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_protocol_credential_iso_mdoc",from="src"}]
