[project]
name = "tba-protocol-authorization-resource-server"
version = "0.4.0.dev2"
description = "OAuth protected-resource facade over token, DPoP, mTLS, and policy validators for the TBA package suite."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "authz",
    "resource-server",
    "protected-api",
    "access-token",
    "oauth",
    "scopes",
    "audience",
    "introspection",
    "iam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tba-protocol-oauth==0.4.0.dev2",
    "tba-protocol-jwt==0.4.0.dev2",
    "tba-provider-authorization-resource-server-verifier==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-capability-protected-resource-authorization==0.4.0.dev2",
    "tba-provider-security-dpop-cnf-binding-validator==0.1.0",
    "tba-provider-security-mtls-cnf-binding-validator==0.1.0",
    "tba-capability-protected-resource-authorization==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
]
[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/50-protocols/tba-protocol-authorization-resource-server"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-protocol-authorization-resource-server/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_protocol_authorization_resource_server", from = "src" }]
