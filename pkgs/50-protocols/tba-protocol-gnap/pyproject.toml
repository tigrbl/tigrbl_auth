[project]
name = "tba-protocol-gnap"
version = "0.4.0.dev2"
description = "Versioned RFC 9635 Grant Negotiation and Authorization Protocol mapping."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tba-concrete-claim-assertions==0.4.0.dev2",
    "tba-concrete-claim-subject-identifiers==0.4.0.dev2",
    "tba-concrete-claim-updated-at-rfc3339==0.4.0.dev2",
    "tba-capability-delegated-access-negotiation==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_protocol_gnap", from = "src" }]
