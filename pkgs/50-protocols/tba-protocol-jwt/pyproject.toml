[project]
name="tba-protocol-jwt"
version="0.4.0.dev2"
readme = "README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies=["tba-contracts-protected-envelope==0.4.0.dev2","tba-concrete-jwt==0.4.0.dev2","tba-contracts-identity==0.4.0.dev2","tba-concrete-claim-issuer==0.4.0.dev2","tba-concrete-claim-subject==0.4.0.dev2","tba-concrete-claim-audience==0.4.0.dev2","tba-concrete-claim-expiration==0.4.0.dev2","tba-concrete-claim-not-before==0.4.0.dev2","tba-concrete-claim-issued-at==0.4.0.dev2","tba-concrete-claim-jwt-id==0.4.0.dev2"]
[build-system]
requires=["poetry-core>=1.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_protocol_jwt",from="src"}]
