[project]
name = "tba-protocol-oidc"
version = "0.4.0.dev2"
description = "OpenID Connect provider protocol implementation package for the TBA package suite."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "auth",
    "protocol",
    "oidc",
    "openid-connect",
    "id-token",
    "userinfo",
    "discovery",
    "logout",
    "iam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic==2.12.5",
    "tba-protocol-oauth==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-provider-identity-jose==0.4.0.dev2",
    "tba-concrete-identity-assurance==0.4.0.dev2",
    "tba-provider-claims-local==0.1.0",
    "tba-concrete-public-subject-identifier==0.4.0.dev2",
    "tba-concrete-pairwise-subject-identifier==0.4.0.dev2",
    "tba-concrete-claim-authentication-time==0.4.0.dev2",
    "tba-concrete-claim-nonce==0.4.0.dev2",
    "tba-concrete-claim-authentication-context==0.4.0.dev2",
    "tba-concrete-claim-authentication-methods==0.4.0.dev2",
    "tba-concrete-claim-authorized-party==0.4.0.dev2",
    "tba-concrete-claim-verified-claims==0.4.0.dev2",
    "tba-concrete-claim-place-of-birth==0.4.0.dev2",
    "tba-concrete-claim-nationalities==0.4.0.dev2",
    "tba-concrete-claim-birth-family-name==0.4.0.dev2",
    "tba-concrete-claim-birth-given-name==0.4.0.dev2",
    "tba-concrete-claim-birth-middle-name==0.4.0.dev2",
    "tba-concrete-claim-salutation==0.4.0.dev2",
    "tba-concrete-claim-title==0.4.0.dev2",
    "tba-concrete-claim-msisdn==0.4.0.dev2",
    "tba-concrete-claim-also-known-as==0.4.0.dev2",
    "tba-concrete-claim-address-country-code==0.4.0.dev2",
    "tba-concrete-claim-transaction-id==0.4.0.dev2",
    "tba-concrete-claim-name==0.4.0.dev2",
    "tba-concrete-claim-given-name==0.4.0.dev2",
    "tba-concrete-claim-family-name==0.4.0.dev2",
    "tba-concrete-claim-middle-name==0.4.0.dev2",
    "tba-concrete-claim-nickname==0.4.0.dev2",
    "tba-concrete-claim-preferred-username==0.4.0.dev2",
    "tba-concrete-claim-profile-uri==0.4.0.dev2",
    "tba-concrete-claim-picture-uri==0.4.0.dev2",
    "tba-concrete-claim-website-uri==0.4.0.dev2",
    "tba-concrete-claim-email==0.4.0.dev2",
    "tba-concrete-claim-email-verified==0.4.0.dev2",
    "tba-concrete-claim-gender==0.4.0.dev2",
    "tba-concrete-claim-birthdate==0.4.0.dev2",
    "tba-concrete-claim-zoneinfo==0.4.0.dev2",
    "tba-concrete-claim-locale==0.4.0.dev2",
    "tba-concrete-claim-phone-number==0.4.0.dev2",
    "tba-concrete-claim-phone-number-verified==0.4.0.dev2",
    "tba-concrete-claim-address==0.4.0.dev2",
    "tba-concrete-claim-updated-at==0.4.0.dev2",
    "tba-concrete-claim-access-token-hash==0.4.0.dev2",
    "tba-concrete-claim-authorization-code-hash==0.4.0.dev2",
    "tba-concrete-claim-state-hash==0.4.0.dev2",
    "tba-concrete-claim-session-id==0.4.0.dev2",
]
[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/50-protocols/tba-protocol-oidc"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-protocol-oidc/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_protocol_oidc", from = "src" }]
