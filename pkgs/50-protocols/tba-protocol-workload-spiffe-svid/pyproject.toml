[project]
name="tba-protocol-workload-spiffe-svid"
version="0.4.0.dev2"
description = "Stable SPIFFE ID, X.509-SVID, and JWT-SVID profile ownership."
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "tba-concrete-x509-svid-credential==0.4.0.dev2",
    "tba-concrete-jwt-svid-credential==0.4.0.dev2",
    "tba-concrete-certificate-x509==0.4.0.dev2",
    "tba-concrete-jwt==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
    "tba-provider-jose-cryptography==0.4.0.dev2",
]
[build-system]
requires=["poetry-core>=1.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_protocol_workload_spiffe_svid",from="src"}]