[project]
name = "tba-protocol-oidc-relying-party"
version = "0.4.0.dev2"
description = "OpenID Connect relying-party and OAuth client protocol implementation package for the TBA package suite."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "auth",
    "protocol",
    "oidc",
    "openid-connect",
    "relying-party",
    "rp",
    "oauth-client",
    "pkce",
    "iam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tba-protocol-oidc==0.4.0.dev2",
    "tba-concrete-claim-audience==0.4.0.dev2",
    "tba-concrete-claim-authentication-context==0.4.0.dev2",
    "tba-concrete-claim-authentication-methods==0.4.0.dev2",
    "tba-concrete-claim-authentication-time==0.4.0.dev2",
    "tba-concrete-claim-authorized-party==0.4.0.dev2",
    "tba-concrete-claim-expiration==0.4.0.dev2",
    "tba-concrete-claim-issued-at==0.4.0.dev2",
    "tba-concrete-claim-issuer==0.4.0.dev2",
    "tba-concrete-claim-nonce==0.4.0.dev2",
    "tba-concrete-claim-subject==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-provider-security-proof-pkce==0.1.0",
]
[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/50-protocols/tba-protocol-oidc-relying-party"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-protocol-oidc-relying-party/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_protocol_oidc_relying_party", from = "src" }]
