[project]
name = "tba-protocol-oauth"
version = "0.4.0.dev2"
description = "OAuth 2.x and OAuth 2.1 profile protocol implementation package for the TBA package suite."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "auth",
    "protocol",
    "oauth",
    "oauth2",
    "oauth2.1",
    "par",
    "rar",
    "token-exchange",
    "dynamic-client-registration",
    "iam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic[email]==2.12.5",
    "tba-protocol-gnap==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-capability-token-introspection==0.4.0.dev2",
    "tba-capability-token-issuance==0.4.0.dev2",
    "tba-capability-token-revocation==0.4.0.dev2",
    "tba-capability-authorization-request-staging==0.4.0.dev2",
    "tba-capability-client-registration==0.4.0.dev2",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-provider-identity-jose==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
    "tba-provider-security-proof-pkce==0.1.0",
    "tba-concrete-authorization-scope-set-matcher==0.4.0.dev2",
    "tba-concrete-claim-client-id==0.4.0.dev2",
    "tba-concrete-claim-confirmation==0.4.0.dev2",
    "tba-concrete-claim-scope==0.4.0.dev2",
    "tba-concrete-claim-http-method==0.4.0.dev2",
    "tba-concrete-claim-http-uri==0.4.0.dev2",
    "tba-concrete-claim-access-token-digest==0.4.0.dev2",
    "tba-concrete-claim-actor==0.4.0.dev2",
    "tba-concrete-claim-may-act==0.4.0.dev2",
    "tba-concrete-claim-jwt-id==0.4.0.dev2",
    "tba-concrete-claim-issued-at==0.4.0.dev2",
    "tba-concrete-claim-nonce==0.4.0.dev2",
]
[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/50-protocols/tba-protocol-oauth"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-protocol-oauth/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_protocol_oauth", from = "src" }]
