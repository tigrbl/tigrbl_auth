[project]
name="tba-protocol-security-event-set"
version="0.4.0.dev3"
description = "Security Event Token (SET) protocol composition."
license = "Apache-2.0"
readme = "README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
dependencies=["tba-contracts-identity==0.4.0.dev3", "tba-bases-security-event==0.4.0.dev3", "tba-concrete-set==0.4.0.dev3", "tba-concrete-claim-issuer==0.4.0.dev3", "tba-concrete-claim-audience==0.4.0.dev3", "tba-concrete-claim-issued-at==0.4.0.dev3", "tba-concrete-claim-jwt-id==0.4.0.dev3", "tba-concrete-claim-subject==0.4.0.dev3", "tba-concrete-claim-security-events==0.4.0.dev3", "tba-provider-set-transmitter==0.4.0.dev3", "tba-provider-set-receiver==0.4.0.dev3"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/50-protocols/tba-protocol-security-event-set#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/50-protocols/tba-protocol-security-event-set#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/50-protocols/tba-protocol-security-event-set"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-protocol-security-event-set/"
[build-system]
requires=["poetry-core>=2.2.0,<3.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_protocol_security_event_set",from="src"}]
