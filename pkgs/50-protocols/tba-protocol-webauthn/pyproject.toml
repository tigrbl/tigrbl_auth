[project]
name = "tba-protocol-webauthn"
version = "0.4.0.dev2"
description = "Versioned W3C Web Authentication relying-party protocol implementation."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "cbor2==6.1.3",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-concrete-cose==0.4.0.dev2",
    "tba-provider-cose-cryptography==0.4.0.dev2",
    "tba-capability-public-key-registration==0.4.0.dev2",
    "tba-capability-public-key-authentication==0.4.0.dev2",
]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_protocol_webauthn", from = "src" }]
