[project]
name = "tba-protocol-oid4vp"
version = "0.4.0.dev2"
readme = "README.md"
description = "OpenID for Verifiable Presentations protocol package."
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = "Apache-2.0"
dependencies = [
    "tba-concrete-claim-client-id==0.4.0.dev2",
    "tba-concrete-claim-nonce==0.4.0.dev2",
    "tba-concrete-claim-transaction-id==0.4.0.dev2",
    "tba-capability-digital-credential-presentation==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_protocol_oid4vp", from = "src" }]
