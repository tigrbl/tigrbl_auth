[project]
name="tba-profile-workload-proof-wimse-wpt"
version="0.4.0.dev4"
description = "WIMSE Workload Proof Token."
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "tba-contracts-proof-of-possession==0.4.0.dev2",
    "tba-contracts-replay==0.4.0.dev2",
    "tba-profile-workload-credential-wimse-wit==0.4.0.dev4",
    "tba-concrete-jwt==0.4.0.dev2",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-provider-jose-cryptography==0.4.0.dev3",
]
[build-system]
requires=["poetry-core>=1.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_profile_workload_proof_wimse_wpt",from="src"}]
