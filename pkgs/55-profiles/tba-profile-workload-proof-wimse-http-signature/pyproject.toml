[project]
name = "tba-profile-workload-proof-wimse-http-signature"
version = "0.4.0.dev2"
description = "WIMSE draft-08 HTTP request proof profile"
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = [
    "cryptography>=45",
    "tba-profile-workload-credential-wimse-wit==0.4.0.dev4",
    "tba-provider-jose-cryptography==0.4.0.dev3",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "tba_profile_workload_proof_wimse_http_signature", from = "src"}]
