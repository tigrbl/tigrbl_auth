[project]
name = "tba-profile-workload-proof-wimse-http-signature"
version = "0.4.0.dev3"
description = "WIMSE draft-08 HTTP request proof profile"
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = ["cryptography>=45", "tba-profile-workload-credential-wimse-wit==0.4.0.dev5", "tba-provider-jose-cryptography==0.4.0.dev4"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/55-profiles/tba-profile-workload-proof-wimse-http-signature#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/55-profiles/tba-profile-workload-proof-wimse-http-signature#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/55-profiles/tba-profile-workload-proof-wimse-http-signature"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-profile-workload-proof-wimse-http-signature/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "tba_profile_workload_proof_wimse_http_signature", from = "src"}]
