[project]
name="tba-profile-credential-vc-jose-cose"
version="0.4.0.dev2"
readme = "README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies=["cbor2>=5.6.0", "tba-primitives-identity==0.4.0.dev2", "tba-contracts-protected-envelope==0.4.0.dev2", "tba-concrete-vc-jose-credential==0.4.0.dev2", "tba-concrete-vc-cose-credential==0.4.0.dev2", "tba-protocol-security-jws==0.4.0.dev2", "tba-protocol-security-cose==0.4.0.dev2"]
[build-system]
requires=["poetry-core>=1.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_profile_credential_vc_jose_cose",from="src"}]