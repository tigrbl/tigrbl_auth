[project]
name = "tba-storage-core"
version = "0.4.0.dev2"
description = "Tigrbl and SQLAlchemy identity tables, ORM models, migrations, persistence helpers, and table-owned operations for IAM runtimes."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "identity",
    "storage",
    "sqlalchemy",
    "tba-tables",
    "migrations",
    "database",
    "iam",
    "persistence",
    "table-operations",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tigrbl==0.4.5.dev4",
    "tigrbl-core==0.4.5.dev4",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
    "tigrbl-migrations>=0.4.5.dev4",
    "tba-storage-access-governance==0.4.0.dev2",
    "tba-storage-attestation==0.4.0.dev2",
    "tba-storage-audit==0.4.0.dev2",
    "tba-storage-authentication==0.4.0.dev2",
    "tba-storage-authority-graph==0.4.0.dev2",
    "tba-storage-authorization-policy==0.4.0.dev2",
    "tba-storage-certificate==0.4.0.dev2",
    "tba-storage-claims==0.4.0.dev2",
    "tba-storage-consent==0.4.0.dev2",
    "tba-storage-delegation==0.4.0.dev2",
    "tba-storage-did==0.4.0.dev2",
    "tba-storage-digital-credential==0.4.0.dev2",
    "tba-storage-federation==0.4.0.dev2",
    "tba-storage-principals==0.4.0.dev2",
    "tba-storage-gnap==0.4.0.dev2",
    "tba-storage-key-material==0.4.0.dev2",
    "tba-storage-oauth==0.4.0.dev2",
    "tba-storage-oidc==0.4.0.dev2",
    "tba-storage-operator==0.4.0.dev2",
    "tba-storage-presentation==0.4.0.dev2",
    "tba-storage-release-governance==0.4.0.dev2",
    "tba-storage-replay-protection==0.4.0.dev2",
    "tba-storage-residency==0.4.0.dev2",
    "tba-storage-scim==0.4.0.dev2",
    "tba-storage-security-event==0.4.0.dev2",
    "tba-storage-token==0.4.0.dev2",
    "tba-storage-tenancy==0.4.0.dev2",
    "tba-storage-trust-federation-graph==0.4.0.dev2",
    "tba-storage-webauthn==0.4.0.dev2",
    "tba-storage-workload-identity==0.4.0.dev2",
]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/01-storage/tba-storage-core"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-storage-core/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_storage_core", from = "src" }]
include = [
    "src/tba_storage_core/storage.toml",
    "src/tba_storage_core/storage.lock.toml",
]
