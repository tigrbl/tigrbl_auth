[project]
name = "tigrbl-identity-storage-core"
version = "0.4.0.dev2"
description = "Shared table framework and schema primitives for standalone Tigrbl identity storage components."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tigrbl>=0.4.4.dev1,<0.5",
    "tigrbl-core>=0.4.4.dev1,<0.5",
    "tigrbl-identity-core==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tigrbl_identity_storage_core", from = "src" }]
