[project]
name = "tba-credentials"
version = "0.4.0.dev2"
description = "Credential facade for authentication, digital, and workload credential domains in the TBA package suite."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "authn",
    "authentication",
    "credentials",
    "passwords",
    "api-keys",
    "sessions",
    "tokens",
    "iam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tba-provider-secret-hashing-bcrypt==0.1.0",
    "tba-concrete-credential-api-key==0.4.0.dev2",
    "tba-concrete-credential-client-secret==0.4.0.dev2",
    "tba-concrete-credential-dpop-key==0.4.0.dev2",
    "tba-concrete-credential-mfa==0.4.0.dev2",
    "tba-concrete-credential-mtls-certificate==0.4.0.dev2",
    "tba-concrete-credential-passkey==0.4.0.dev2",
    "tba-concrete-credential-password==0.4.0.dev2",
    "tba-concrete-credential-password-reset==0.4.0.dev2",
    "tba-concrete-credential-service-key==0.4.0.dev2",
    "tba-provider-identity-jose==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-contracts-digital-credential==0.4.0.dev2",
    "tba-contracts-workload-identity==0.4.0.dev2",
]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/70-facade/tba-credentials"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-credentials/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_credentials", from = "src" }]
