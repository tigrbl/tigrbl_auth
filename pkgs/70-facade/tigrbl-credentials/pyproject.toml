[project]
name = "tigrbl-credentials"
version = "0.4.0.dev2"
description = "Credential facade for authentication, digital, and workload credential domains in the Tigrbl auth package suite."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "authn",
    "authentication",
    "credentials",
    "passwords",
    "api-keys",
    "sessions",
    "tokens",
    "iam",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tigrbl-secret-hashing-bcrypt-provider==0.1.0",
    "tigrbl-api-key-credential-concrete==0.4.0.dev2",
    "tigrbl-client-secret-credential-concrete==0.4.0.dev2",
    "tigrbl-dpop-key-credential-concrete==0.4.0.dev2",
    "tigrbl-mfa-credential-concrete==0.4.0.dev2",
    "tigrbl-mtls-certificate-credential-concrete==0.4.0.dev2",
    "tigrbl-passkey-credential-concrete==0.4.0.dev2",
    "tigrbl-password-credential-concrete==0.4.0.dev2",
    "tigrbl-password-reset-credential-concrete==0.4.0.dev2",
    "tigrbl-service-key-credential-concrete==0.4.0.dev2",
    "tigrbl-identity-jose==0.4.0.dev2",
    "tigrbl-identity-contracts==0.4.0.dev2",
    "tigrbl-digital-credential-contracts==0.4.0.dev2",
    "tigrbl-workload-identity-contracts==0.4.0.dev2",
]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/70-facade/tigrbl-credentials"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tigrbl-credentials/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tigrbl_credentials", from = "src" }]
