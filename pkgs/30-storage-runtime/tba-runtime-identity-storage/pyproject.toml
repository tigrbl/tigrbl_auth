[project]
name = "tba-runtime-identity-storage"
version = "0.4.0.dev2"
description = "Runtime execution helpers for TBA identity storage migrations and provider-bound storage lifecycle wiring."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = [
    "tigrbl",
    "identity",
    "storage-runtime",
    "migrations",
    "database",
    "runtime",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic==2.12.5",
    "tba-provider-security-authorization-provenance-builder==0.1.0",
    "tigrbl-concrete @ git+https://github.com/tigrbl/tigrbl.git@1368ad888277926e3a5e322081d0306cbbc7ebf3#subdirectory=pkgs/70_concrete/tigrbl_concrete",
    "tigrbl-core==0.4.5.dev4",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-storage-core==0.4.0.dev2",
    "tigrbl-migrations>=0.4.5.dev4",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
    "tba-durability-identity==0.4.0.dev2",
    "tba-durability-session==0.4.0.dev2",
    "tba-durability-consent==0.4.0.dev2",
    "tba-durability-token==0.4.0.dev2",
    "tba-durability-oauth-state==0.4.0.dev2",
    "tba-durability-oidc-state==0.4.0.dev2",
    "tba-durability-delegation==0.4.0.dev2",
    "tba-durability-authorization-policy==0.4.0.dev2",
    "tba-durability-digital-credential==0.4.0.dev2",
    "tba-durability-presentation==0.4.0.dev2",
    "tba-durability-attestation==0.4.0.dev2",
    "tba-durability-security-event==0.4.0.dev2",
    "tba-durability-workload-identity==0.4.0.dev2",
    "tba-durability-replay-protection==0.4.0.dev2",
    "tba-durability-webauthn==0.4.0.dev2",
    "tba-durability-gnap-state==0.4.0.dev2",
    "tba-durability-audit==0.4.0.dev2",
    "tba-durability-key-material==0.4.0.dev2",
]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/30-storage-runtime/tba-runtime-identity-storage"
SSOT = "https://github.com/tigrbl/tigrbl_auth/blob/master/.ssot/registry.json"
PyPI = "https://pypi.org/project/tba-runtime-identity-storage/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_runtime_identity_storage", from = "src" }]
