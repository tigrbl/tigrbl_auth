[project]
name = "tba-durability-trust-federation-graph"
version = "0.4.0.dev2"
description = "Durable trust-federation graph table operations and specifications."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tigrbl==0.4.5.dev4",
    "tba-storage-core==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_durability_trust_federation_graph", from = "src" }]
