[project]
name = "tba-runtime-relying-party-session"
version = "0.4.0.dev5"
description = "Server-side RP login transaction and one-time state runtime."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
]
license = "Apache-2.0"
dependencies = ["tba-contracts-identity>=0.4.0.dev2,<=0.4.0.dev3", "tba-provider-security-proof-pkce>=0.1.0,<=0.1.1.dev1"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/30-storage-runtime/tba-runtime-relying-party-session#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/30-storage-runtime/tba-runtime-relying-party-session#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/30-storage-runtime/tba-runtime-relying-party-session"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-runtime-relying-party-session/"
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_runtime_relying_party_session", from = "src" }]
