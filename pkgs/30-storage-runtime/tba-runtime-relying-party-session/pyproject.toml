[project]
name = "tba-runtime-relying-party-session"
version = "0.4.0.dev3"
description = "Server-side RP login transaction and one-time state runtime."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_runtime_relying_party_session", from = "src" }]
