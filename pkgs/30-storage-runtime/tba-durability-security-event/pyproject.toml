[project]
name = "tba-durability-security-event"
version = "0.4.0.dev2"
description = "Carrier-neutral layer-30 durable table operations."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tigrbl==0.4.5.dev4",
    "tba-storage-core==0.4.0.dev2",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-contracts-identity==0.4.0.dev2",
    "tba-bases-replay==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_durability_security_event", from = "src" }]
