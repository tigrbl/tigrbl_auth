[project]
name = "tba-durability-key-material"
version = "0.4.0.dev2"
description = "Durable crypto-key table hooks and specifications."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tigrbl==0.4.5.dev4",
    "tigrbl==0.4.5.dev4",
    "tba-storage-core==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_durability_key_material", from = "src" }]
