[project]
name = "tba-provider-policy-administration-memory"
version = "0.4.0.dev2"
description = "In-memory RBAC, ABAC, delegated-administration, and policy engine providers."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-provider-access-governance-memory==0.4.0.dev2", "tba-contracts-identity==0.4.0.dev2", "tba-primitives-identity==0.4.0.dev2"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_provider_policy_administration_memory", from = "src" }]
