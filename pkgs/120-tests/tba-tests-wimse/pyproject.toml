[project]
description = "WIMSE workload credential and proof assurance tests for Tigrbl Auth"
readme = "README.md"
name = "tba-tests-wimse"
version = "0.4.0.dev2"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/120-tests/tba-tests-wimse#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/120-tests/tba-tests-wimse#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/120-tests/tba-tests-wimse"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
[tool.uv]
package = false
