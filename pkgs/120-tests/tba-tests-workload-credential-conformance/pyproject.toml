[project]
name="tba-tests-workload-credential-conformance"
version="0.4.0.dev3"
description = "Reusable structural and negative vectors."
license = "Apache-2.0"
readme = "README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
dependencies=[]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[project.optional-dependencies]
runner = ["cryptography>=45.0.0", "packaging>=24.0", "pytest>=8.0", "tba-primitives-identity==0.4.0.dev3", "tomli>=2.0; python_version < '3.11'"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/120-tests/tba-tests-workload-credential-conformance#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/120-tests/tba-tests-workload-credential-conformance#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/120-tests/tba-tests-workload-credential-conformance"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-tests-workload-credential-conformance/"
[build-system]
requires=["poetry-core>=2.2.0,<3.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_tests_workload_credential_conformance",from="src"}]
