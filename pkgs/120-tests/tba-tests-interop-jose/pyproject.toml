[project]
name = "tba-tests-interop-jose"
version = "0.1.0"
description = "Bidirectional compact JWE interoperability tests for TbA and Swarmauri"
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "pytest", "jwe", "x448", "interoperability"]
dependencies = ["cryptography>=45.0.0", "pytest>=8.0", "pytest-asyncio>=0.24.0"]

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/120-tests/tba-tests-interop-jose"
PyPI = "https://pypi.org/project/tba-tests-interop-jose/"

[project.entry-points.pytest11]
"tba_tests_interop_jose.pytest_plugin" = "tba_tests_interop_jose.pytest_plugin"

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_tests_interop_jose", from = "src" }]

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "tigrbl-auth"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl_auth"
ref = "master"
package_path = "pkgs/120-tests/tba-tests-interop-jose"
layer = "120-tests"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tba-tests-interop-jose"
published = false

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.sh"
test = "docs/readme/test_examples.py"
language = "bash"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.sh"
test = "docs/readme/test_examples.py"
language = "bash"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/120-tests/tba-tests-interop-jose/docs/readme/test_examples.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/120-tests/tba-tests-interop-jose/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[dependency-groups]
dev = ["readme-standards==0.1.3; python_version >= \"3.11\""]
