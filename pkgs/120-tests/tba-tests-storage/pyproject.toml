[project]
readme = "README.md"
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "pytest"]
description = "TbA pytest suite for storage"
name = "tba-tests-storage"
version = "0.4.0.dev2"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"

[tool.uv]
package = false

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "tigrbl-auth"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl_auth"
ref = "master"
package_path = "pkgs/120-tests/tba-tests-storage"
layer = "120-tests"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tba-tests-storage"
published = false

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.sh"
test = "docs/readme/test_examples.py"
language = "bash"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.sh"
test = "docs/readme/test_examples.py"
language = "bash"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/120-tests/tba-tests-storage/docs/readme/test_examples.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/120-tests/tba-tests-storage/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"
[project.urls]
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/120-tests/tba-tests-storage"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[dependency-groups]
dev = ["readme-standards==0.1.1; python_version >= \"3.11\""]
