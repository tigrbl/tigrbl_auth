[project]
name="tba-testkit-workload-credential-conformance"
version="0.4.0.dev2"
description = "Reusable structural and negative vectors."
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies=[]

[project.optional-dependencies]
runner = [
    "cryptography>=45.0.0",
    "packaging>=24.0",
    "pytest>=8.0",
    "tba-primitives-identity==0.4.0.dev2",
    "tomli>=2.0; python_version < '3.11'",
]
[build-system]
requires=["poetry-core>=1.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_testkit_workload_credential_conformance",from="src"}]
