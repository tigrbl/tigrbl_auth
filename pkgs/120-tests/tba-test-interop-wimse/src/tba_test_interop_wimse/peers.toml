# Endpoint capabilities require evidence for the exact role, profile, scheme and version.
# Add version and evidence when marking a row qualified.
# [qualified_support."enforcing:wic_issuer:baseline"]
# implementation = "..."
# version = "..."
# configuration = "..."
# evidence = "..."
schema_version = 1

# Entity type keys come from hops.toml. Role, profile, and identifier
# scheme still determine a workload binding. Qualification is recorded
# on the corresponding endpoint or support binding in the lab snapshot.
[implementations.tba]
name = "Tigrbl Auth"
entity_types = ["workload", "delegation-authority", "token-service", "status-policy-service"]
planned_entity_types = ["credential-delivery-service"]
native_baseline = "planned"

# Development readiness for an all-TbA flow. Qualification for an actual
# version and configuration remains in the runtime snapshot.
[implementations.tba.native_roles]
caller = "interop-qualified"
receiver = "interop-qualified"
delegator = "local-fixture"
delegate = "local-fixture"
delegation-authority = "local-fixture"
token-client = "local-fixture"
token-issuer = "local-fixture"
transaction-token-issuer = "local-fixture"
credential-requester = "components"
credential-delivery = "components"
policy-client = "local-fixture"
status-authority = "local-fixture"
before-effect-enforcer = "local-fixture"
delegation-receipt-verifier = "planned"
approval-verifier = "local-fixture"

[implementations.wimsey]
name = "wimsey"
entity_types = ["workload"]
candidate_ref = "56b070582f3e380c5006630698fb4ca808c08b04"
component_tests = ["tests/peer/test_wimsey_wic_component.py", "tests/peer/test_wimsey_http_signature.py"]
qualification_gap = "WIC and HTTP signature components validated. A complete peer endpoint needs explicit transport, identity policy, and resource configuration."

[implementations.cred]
name = "Cred"
entity_types = ["workload"]
candidate_ref = "hackathon/ietf127"
candidate_revision = "586e1a76f487c2376e0ba0a4687bb2de8d3eb588"
component_tests = ["tests/peer/test_baselines.py"]
qualification_gap = "WIT/WPT and draft-08 HTTP signatures are qualified separately by the pinned HTTPS lab. HTTP signatures cover direct requests and transaction binding with a lab-issued WIT."

[implementations.cofide]
name = "Cofide WIMSE PoC"
entity_types = ["workload"]
candidate_ref = "7984a60105002dc65b31e9cd08572cd5d10ed9d6"
qualification_gap = "This revision uses @request-target and P-256 for its demo client. The current TbA fixture targets the draft-08 @path and @query request profile with Ed25519."

[implementations.combined-wpt-candidate]
name = "Independent WIC/WPT peer to select"
entity_types = ["workload"]
placeholder = true

[implementations.combined-signature-candidate]
name = "Independent WIC/HTTP signature peer to select"
entity_types = ["workload"]
placeholder = true

# Candidate roles record the intended integration. Only [[capabilities]] and
# qualified support in a lab snapshot bind roles to executable rows.
[implementations.defakto]
name = "Defakto Security"
entity_types = ["workload"]
candidate_endpoint_profiles = [{ profile = "wic-mtls", identifier_scheme = "spiffe", roles = ["caller", "receiver"] }]
reference = "https://datatracker.ietf.org/doc/html/draft-ietf-wimse-workload-creds-03#section-8"
qualification_gap = "Use the pinned SDK verifier with the shared SPIFFE mTLS fixture. A Defakto-managed credential issuer and application-proof roles require separate evidence."

[implementations.go-spiffe]
name = "go-spiffe"
entity_types = ["workload"]
candidate_endpoint_profiles = [{ profile = "wic-mtls", identifier_scheme = "spiffe", roles = ["caller", "receiver"] }]
reference = "https://github.com/spiffe/go-spiffe/tree/main/examples"
qualification_gap = "Use the pinned go-spiffe verifier with the shared SPIFFE mTLS fixture and the separate SPIRE Agent credential-delivery control."

[implementations.agentmaurice]
name = "AgentMaurice"
entity_types = ["workload"]
candidate_endpoint_profiles = [
    { profile = "wit-wpt", identifier_scheme = "none", roles = ["caller", "receiver"] },
    { profile = "wit-http-signature", identifier_scheme = "none", roles = ["caller", "receiver"] },
]
reference = "https://mailarchive.ietf.org/arch/msg/wimse/6ofJ6o3sK9H_XEPCQWn_7SVEza4/"
qualification_gap = "The v2.2.18 release advertises WIT with WPT and HTTP signatures. Verify the interoperable request interface and both directional bindings before qualifying these roles."

[implementations.teleport-tbot]
name = "Teleport tbot"
entity_types = ["credential-delivery-service"]
candidate_support_roles = ["credential-delivery"]
candidate_credentials = ["x509-svid"]
reference = "https://goteleport.com/docs/machine-workload-identity/workload-identity/getting-started/"
qualification_gap = "Pin Teleport and tbot configuration. Verify Workload API delivery, the returned trust bundle, and use of the credential on the next mTLS hop."

[implementations.mintid]
name = "MintID"
entity_types = ["status-policy-service"]
candidate_ref = "public-v2026-11-13.1"
candidate_support_roles = ["status-authority"]
scenario_families = ["12"]
reference = "https://mailarchive.ietf.org/arch/msg/wimse/8wNHgFgnEncJymh7TqA_V0cQQ4g/"
qualification_gap = "Verify the before-effect control, issuer revocation and holder self-revocation. Use witness refresh to attribute the shared refusal code. Stale and unavailable status need separate fixtures."

[implementations.authgent]
name = "authgent"
entity_types = ["token-service"]
candidate_ref = "8341cf932c9816dc666f2a6577b6776bd6f3b978"
candidate_support_roles = ["transaction-token-issuer"]
scenario_families = ["07", "08"]
reference = "https://github.com/cred-ninja/sdk/blob/586e1a76f487c2376e0ba0a4687bb2de8d3eb588/conformance/interop/authgent-txn-tokens.md"
qualification_gap = "Cred recorded transaction-token interoperability at this revision. Qualify issuance and request binding with TbA, then verify cross-domain exchange separately."

[implementations.omniarx]
name = "OmniArx"
entity_types = ["status-policy-service"]
candidate_support_roles = ["approval-verifier"]
scenario_families = ["17"]
reference = "https://mailarchive.ietf.org/arch/msg/wimse/7tXnDz__aPxZO9SR2p5zj3elrfc/"
qualification_gap = "V5 acceptance and R2 display-mismatch refusal were reported. Obtain an accessible verifier with action context and qualify it with the fixed vector clock and fresh replay state."

[implementations.emilia]
name = "EMILIA"
entity_types = ["status-policy-service"]
candidate_support_roles = ["before-effect-enforcer"]
scenario_families = ["12"]
reference = "https://github.com/emiliaprotocol/emilia-protocol/blob/main/conformance/vectors/revocation.v1.json"
qualification_gap = "Pin the enforcing adapter and prove that revocation observed after initial authorization prevents the protected effect."

[implementations.redthread]
name = "Redthread Security"
entity_types = ["status-policy-service"]
candidate_support_roles = ["delegation-receipt-verifier", "before-effect-enforcer"]
scenario_families = ["12", "13"]
reference = "https://mailarchive.ietf.org/arch/msg/wimse/XprRASN1rnD9F3KD7u2glKTNMQY/"
qualification_gap = "Obtain the offered executor trace and manifest, pin a runnable interface, and qualify delegation narrowing and refusal before effect."

