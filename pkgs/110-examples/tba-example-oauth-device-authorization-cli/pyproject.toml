[project]
name = "tba-example-oauth-device-authorization-cli"
version = "0.1.1.dev1"
license = "Apache-2.0"
readme = "README.md"
description = "Example consumer package showing CLI login against tba_auth device authorization."
requires-python = ">=3.10,<3.16"
classifiers = ["Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Development Status :: 3 - Alpha"]
dependencies = ["httpx>=0.28,<0.29"]
license-files = ["LICENSE", "NOTICE"]
keywords = ["tigrbl", "tba", "identity"]

[project.scripts]
oauth-device-login = "oauth_device_authorization_cli_example.main:main"

[[project.authors]]
name = "Jacob Stewart"
email = "jacob@swarmauri.com"

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/110-examples/tba-example-oauth-device-authorization-cli#readme"
Documentation = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/110-examples/tba-example-oauth-device-authorization-cli#readme"
Repository = "https://github.com/tigrbl/tigrbl_auth"
Source = "https://github.com/tigrbl/tigrbl_auth/tree/master/pkgs/110-examples/tba-example-oauth-device-authorization-cli"
Issues = "https://github.com/tigrbl/tigrbl_auth/issues"
PyPI = "https://pypi.org/project/tba-example-oauth-device-authorization-cli/"
[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["readme-standards==0.1.1; python_version >= \"3.11\""]

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "tigrbl-auth"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl_auth"
ref = "master"
package_path = "pkgs/110-examples/tba-example-oauth-device-authorization-cli"
layer = "110-examples"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tba-example-oauth-device-authorization-cli"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/110-examples/tba-example-oauth-device-authorization-cli/docs/readme/test_examples.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/pkgs/110-examples/tba-example-oauth-device-authorization-cli/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/tigrbl/tigrbl_auth/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/tigrbl/tigrbl_auth/actions/workflows/readme-standards.yml"
