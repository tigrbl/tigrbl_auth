[project]
name = "tba-example-oauth-device-authorization-cli"
version = "0.1.0"
readme = "README.md"
description = "Example consumer package showing CLI login against tba_auth device authorization."
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "httpx>=0.28,<0.29",
]

[project.scripts]
oauth-device-login = "oauth_device_authorization_cli_example.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
