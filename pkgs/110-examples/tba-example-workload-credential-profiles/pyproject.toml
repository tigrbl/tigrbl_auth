[project]
name="tba-example-workload-credential-profiles"
version="0.4.0.dev2"
readme = "README.md"
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies=["tba-profile-workload-credential-wimse-wit==0.4.0.dev2","tba-profile-workload-proof-wimse-wpt==0.4.0.dev2","tba-profile-workload-credential-spiffe-wit-svid==0.4.0.dev2"]
[build-system]
requires=["poetry-core>=1.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="workload_credential_profiles_example",from="src"}]