[project]
name = "tba-router-wit-issuance"
version = "0.4.0.dev2"
description = "Mountable native WIMSE WIT enrollment endpoint."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = [
    "tigrbl==0.4.5.dev8",
    "pydantic>=2,<3",
    "tba-runtime-identity==0.4.0.dev3",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_router_wit_issuance", from = "src" }]
