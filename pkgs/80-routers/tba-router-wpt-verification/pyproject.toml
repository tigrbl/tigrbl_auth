[project]
name = "tba-router-wpt-verification"
version = "0.4.0.dev2"
description = "Authenticated remote WIT/WPT verification for a configured recipient."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = [
    "tigrbl==0.4.5.dev8",
    "pydantic>=2,<3",
    "tba-concrete-jwt==0.4.0.dev2",
    "tba-profile-workload-proof-wimse-wpt==0.4.0.dev4",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_router_wpt_verification", from = "src" }]
