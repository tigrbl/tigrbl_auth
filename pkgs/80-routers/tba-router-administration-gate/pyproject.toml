[project]
name = "tba-router-administration-gate"
version = "0.4.0.dev2"
description = "Reusable ASGI administration-gate router for TBA."
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "tigrbl==0.4.5.dev4",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-runtime-identity==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_router_administration_gate", from = "src" }]
