[project]
name = "tba-router-administration-gate"
version = "0.4.0.dev2"
readme = "README.md"
description = "Reusable ASGI administration-gate router for TBA."
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = "Apache-2.0"
dependencies = [
    "tigrbl==0.4.5.dev8",
    "tba-primitives-identity==0.4.0.dev2",
    "tba-runtime-identity==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_router_administration_gate", from = "src" }]
