[project]
name = "tigrbl-auth-router-authorization-admin"
version = "0.4.0.dev3"
description = "Reusable customer and internal authorization administration router."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tigrbl-authorization-contracts==0.4.0.dev3", "tigrbl-authorization-policy-durability==0.4.0.dev2"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{include = "tigrbl_auth_router_authorization_admin", from = "src"}]
