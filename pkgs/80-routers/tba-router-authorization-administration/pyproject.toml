[project]
name = "tba-router-authorization-administration"
version = "0.4.0.dev3"
description = "Reusable customer and internal authorization administration router."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = ["tba-contracts-authorization==0.4.0.dev3", "tba-durability-authorization-policy==0.4.0.dev2"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{include = "tba_router_authorization_administration", from = "src"}]
