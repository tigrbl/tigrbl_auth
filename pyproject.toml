[tool.pytest.ini_options]
pythonpath = ["pkgs/60-runtime/tba-cli-identity/src"]
testpaths = ["tests"]
norecursedirs = ["combined", "scripts", ".pytest_cache", "__pycache__", ".uv-cache", ".venv", "dist", ".benchmarks"]
markers = [
    "test: standard test",
    "unit: Unit tests",
    "integration: Integration tests",
    "negative: Negative-path rejection tests",
    "security: Security and abuse-case tests",
    "interop: Interoperability and peer-profile catalog tests",
    "conformance: Certification/conformance tests",
    "r8n: Regression tests",
    "timeout: mark test to timeout after X seconds",
    "extension: optional extension-lane tests outside the default certification boundary",
    "deferred: quarantined or out-of-scope tests excluded from the core certification lane",
    "runtime_heavy: tests that require the full runtime dependency stack",
    "xpass: Expected passes",
    "xfail: Expected failures",
    "acceptance: Acceptance tests",
    "perf: Performance tests that measure execution time and resource usage",
    "example: Usage examples from documentation",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
addopts = "--import-mode=importlib --basetemp=.pytest-tmp"

[tool.ruff.lint.per-file-ignores]
"pkgs/**/src/**/__init__.py" = ["F401", "F403", "F405"]
"pkgs/01-storage/tba-storage-core/src/tba_storage_core/tables/**/_ops.py" = ["E402"]
"pkgs/01-storage/tba-storage-core/src/tba_storage_core/tables/token_record/_ops/__init__.py" = ["E402"]
"pkgs/60-runtime/tba-cli-identity/src/tba_cli_identity/cli/*/_*.py" = [
    "E402",
    "F401",
    "F405",
    "F601",
    "F821",
    "F822",
    "F841",
]
"scripts/*.py" = ["E402"]
"tests/**/*.py" = ["E402", "F403"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.1",
    "pytest-json-report>=1.5.0",
    "requests>=2.32.3",
    "flake8>=7.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.9.9",
    "pytest-benchmark>=4.0.0",
    "tox>=4.23.2",
    "ssot-registry>=0.2.8",
]

